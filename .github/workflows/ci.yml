name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Bash syntax check (bash -n) on every *.sh
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' f; do
            if ! bash -n "$f"; then
              echo "::error file=$f::bash -n syntax error"
              fail=1
            fi
          done < <(find . \
            -path ./.git -prune -o \
            -path ./.backups -prune -o \
            -path ./generated -prune -o \
            -name '*.sh' -type f -print0)
          # Entry files are sourced, not always *.sh — check them too.
          for f in entry/bash_profile entry/bash.sh entry/zsh.sh entry/profile.sh; do
            [[ -f "$f" ]] || continue
            if ! bash -n "$f"; then
              echo "::error file=$f::bash -n syntax error"
              fail=1
            fi
          done
          exit "$fail"

      - name: ShellCheck (warning+ severity)
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          find . -path ./.git -prune -o -path ./generated -prune -o \
            -type f \( -name '*.sh' -o -path './bin/*' \) -print0 \
            | xargs -0 shellcheck --severity=warning

  structure:
    name: Structural smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml zsh tmux direnv

      - name: Theme catalog parses
        run: |
          set -euo pipefail
          # `--list` walks every themes/<name>/meta.sh and prints the catalog.
          # If a theme dir is malformed (missing meta.sh / colors.sh / shell.sh),
          # this fails before any installation step.
          ./bin/theme-switcher --list

      - name: --help endpoints execute cleanly
        run: |
          set -euo pipefail
          ./setup.sh --help                 >/dev/null
          ./bin/theme-switcher --help       >/dev/null
          ./bin/check-updates --help        >/dev/null
          ./bin/diff-config --help          >/dev/null
          ./bin/uninstall-tool --help       >/dev/null
          ./bin/ssh-bridge --help           >/dev/null
          ./bin/dotfiles-feature --help     >/dev/null
          ./bin/opencode-contract --help    >/dev/null

      - name: Codex installer ownership behavior
        run: bash tests/install-codex.sh

      - name: Hermetic behavior and safety suite
        run: |
          set -euo pipefail
          for test_file in \
            tests/argument-parsing.sh tests/state.sh tests/setup-safety.sh \
            tests/config-reconcile.sh tests/eget-staging.sh tests/install-failures.sh tests/minimal-ubuntu.sh \
            tests/install-ai.sh tests/install-toolchains.sh tests/neovim.sh \
            tests/uninstall-safety.sh tests/git-hooks.sh tests/registry.sh tests/agent-badge.sh \
            tests/agent-shell.sh tests/project-environment.sh tests/shell-behavior.sh tests/features.sh tests/theme-system.sh tests/theme-refresh.sh \
            tests/tmux-config.sh tests/verify-profiles.sh tests/wsl.sh \
            tests/xrdp.sh tests/work-selection.sh tests/work-installers.sh \
            tests/work-verify.sh tests/work-smoke.sh tests/validate-structured.sh; do
            bash "$test_file"
          done
          python3 tests/startup-benchmark-test.py

      - name: Cheatsheet TSV is well-formed
        run: |
          set -euo pipefail
          # Every non-comment, non-empty row must have exactly 4 fields
          # separated by U+2502 (│). Bad rows would silently break preview.
          bad=$(awk -F'│' '
            /^#/ || NF == 0 { next }
            NF != 4 { print FILENAME ":" NR ": expected 4 fields, got " NF; bad=1 }
            END { exit bad ? 1 : 0 }
          ' shell/shortcuts-index.tsv) || {
            echo "::error::Malformed cheatsheet rows:"
            echo "$bad"
            exit 1
          }

      - name: CONFIG_MAP source paths exist on disk
        run: |
          set -euo pipefail
          export DOTFILES_DIR="$PWD"
          # shellcheck disable=SC1091
          source lib/config.sh
          fail=0
          for key in "${!CONFIG_MAP[@]}"; do
            src=$(config_source_path "$key")
            if [[ ! -e "$src" ]]; then
              echo "::error::CONFIG_MAP[$key] points at missing source: $src"
              fail=1
            fi
          done
          exit "$fail"

  theme-cycle:
    name: Theme cycling smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Cycle every theme via --init/apply
        run: |
          set -euo pipefail
          export DOTFILES_DIR="$PWD"
          test_root="$(mktemp -d "$RUNNER_TEMP/dotfiles-theme-cycle.XXXXXX")"
          export HOME="$test_root/home"
          export XDG_CONFIG_HOME="$test_root/config"
          export XDG_DATA_HOME="$test_root/data"
          export XDG_STATE_HOME="$test_root/state"
          export XDG_CACHE_HOME="$test_root/cache"
          export TMUX=""
          mkdir -p "$HOME"
          # Discover themes the same way theme-switcher does: every dir
          # under themes/ that contains a meta.sh is a valid theme.
          themes=$(find themes -mindepth 2 -maxdepth 2 -name meta.sh \
            | sed 's|^themes/||; s|/meta.sh$||' | sort)
          [[ -z "$themes" ]] && { echo "no themes discovered"; exit 1; }
          for t in $themes; do
            echo "::group::Apply theme: $t"
            ./bin/theme-switcher "$t"
            state="$XDG_STATE_HOME/dotfiles/theme.tsv"
            actual="$(awk -F '\t' '$1 == "default" { print $2 }' "$state")"
            [[ "$actual" == "$t" ]] \
              || { echo "::error::theme state did not select $t (got: ${actual:-missing})"; exit 1; }
            [[ -f "$XDG_CACHE_HOME/dotfiles/theme/themes/$t/starship.toml" ]] \
              || { echo "::error::theme cache missing for $t"; exit 1; }
            echo "::endgroup::"
          done
          echo "All themes cycled successfully."

  install-test:
    name: Containerized install (--bash)
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    defaults:
      run:
        shell: bash
    steps:
      # The structural jobs above never execute lib/install.sh. This one runs
      # the real installer in a clean container as a non-root sudo user — the
      # only job that exercises apt + eget + symlink + theme-init paths.
      - name: Bootstrap container (git, sudo, locales, non-root user)
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git sudo locales lsb-release
          # setup.sh refuses to run as root, so install as an unprivileged user.
          useradd -m -s /bin/bash test
          echo 'test ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/test
          chmod 0440 /etc/sudoers.d/test

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Stage repo for the test user
        run: |
          set -euo pipefail
          mkdir -p /home/test/dev
          cp -a "$GITHUB_WORKSPACE" /home/test/dev/dotfiles
          chown -R test:test /home/test/dev

      - name: Run the installer (--bash tier)
        run: |
          su - test <<'EOSU'
          set -euo pipefail
          cd ~/dev/dotfiles
          ./setup.sh --bash --force --git-name "CI Bot" --git-email ci@example.com
          EOSU

      - name: Assert configs linked and shell-tier tools on PATH
        run: |
          # Write the assertion to a file and run it via sudo, which propagates
          # the exit code faithfully (a `su -` login/logout session does not).
          # PATH mirrors what env.sh gives a login shell so the tool checks see
          # eget binaries in ~/.local/bin.
          cat > /home/test/assert.sh <<'EOS'
          set -euo pipefail
          cd "$HOME/dev/dotfiles"
          export DOTFILES_DIR="$PWD"
          export PATH="$HOME/.local/bin:$PATH"
          # shellcheck disable=SC1091
          source lib/runtime.sh
          source lib/config.sh
          fail=0
          # Every CONFIG_MAP entry must resolve (reuses the repo's own data).
          for key in "${!CONFIG_MAP[@]}"; do
              mapping="${CONFIG_MAP[$key]}"
              IFS=: read -r target type owner <<< "$mapping"
              config_owner_present "$owner" || continue
              case "$type" in
                  symlink)
                      [[ -L "$target" ]] || { echo "::error::missing symlink: $target"; fail=1; } ;;
                  gitconfig)
                      if [[ ! -f "$target" ]] || grep -q "{{GIT_" "$target"; then
                          echo "::error::gitconfig not processed: $target"; fail=1
                      fi ;;
              esac
          done
          # Every shell-tier tool must be on PATH after install.
          for name in $(tools_for_tier bash); do
              tool_applicable "$name" || continue
              bin="${TOOL_BINARY[$name]}"
              command -v "$bin" >/dev/null 2>&1 \
                || { echo "::error::shell-tier tool missing: $name ($bin)"; fail=1; }
          done
          # AI CLIs (claude, codex) are --ai-gated and must NOT ride the shell
          # tier's `eget --download-all`. Assert codex is absent here; the
          # structure job tests its dedicated standalone-installer path.
          if command -v codex >/dev/null 2>&1; then
              echo "::error::codex must not be installed at the shell tier (--ai only)"; fail=1
          fi
          # WSL-only tools must not be installed on native Ubuntu.
          if command -v wsl2-ssh-agent >/dev/null 2>&1; then
              echo "::error::wsl2-ssh-agent installed on native Ubuntu"; fail=1
          fi
          [[ $fail -eq 0 ]] && echo "Install assertions passed."
          exit $fail
          EOS
          chown test:test /home/test/assert.sh
          sudo -u test -H bash /home/test/assert.sh

      - name: Re-run setup and verify bash profile
        run: |
          su - test -c 'cd ~/dev/dotfiles && ./setup.sh --bash --git-name "CI Bot" --git-email ci@example.com'
          su - test -c 'cd ~/dev/dotfiles && ./bin/verify --tier bash'

  startup-benchmark:
    name: Shell startup benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Install zsh
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zsh

      - name: Compare base and candidate startup
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -z "$BASE_SHA" || "$BASE_SHA" == 0000000000000000000000000000000000000000 ]]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          mkdir -p /tmp/dotfiles-baseline
          git archive "$BASE_SHA" | tar -x -C /tmp/dotfiles-baseline
          python3 tests/startup-benchmark.py /tmp/dotfiles-baseline "$PWD"

  architecture-selection:
    name: Registry selection (${{ matrix.arch }} / ${{ matrix.platform }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [x86_64, aarch64]
        platform: [ubuntu, wsl]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate applicability (selection-only)
        env:
          DOTFILES_TEST_ARCH: ${{ matrix.arch }}
          DOTFILES_TEST_PLATFORM: ${{ matrix.platform }}
        run: bash tests/registry.sh

  ubuntu-matrix:
    name: Ubuntu ${{ matrix.release }} dry-run
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:${{ matrix.release }}
    strategy:
      matrix:
        release: ['22.04', '24.04', '26.04']
    steps:
      - name: Install test prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates git curl bash passwd
          useradd -m -s /bin/bash test
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Exercise supported release without mutation
        run: su -s /bin/bash test -c "cd '$GITHUB_WORKSPACE' && bash tests/setup-safety.sh"
