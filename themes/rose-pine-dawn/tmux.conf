# Rosé Pine Dawn theme for tmux (light)
# Based on https://github.com/rose-pine/tmux

# Status bar colors
set -g status-style bg='#fffaf3',fg='#575279'

# Default pane canvas; applications that paint their own background override it.
set -g window-style bg='#faf4ed',fg='#575279'
set -g window-active-style bg='#faf4ed',fg='#575279'

# Window status colors
set -g window-status-style bg='#fffaf3',fg='#9893a5'
set -g window-status-current-style bg='#f2e9e1',fg='#575279',bold
set -g window-status-activity-style bg='#fffaf3',fg='#286983'

# Pane border colors
set -g pane-border-style fg='#dfdad9'
set -g pane-active-border-style fg='#286983'

# Message colors
set -g message-style bg='#f2e9e1',fg='#575279'
set -g message-command-style bg='#f2e9e1',fg='#575279'

# Copy mode colors
set -g mode-style bg='#dfdad9',fg='#575279'

# Clock mode color
setw -g clock-mode-colour '#286983'

# Display panes colors
set -g display-panes-active-colour '#286983'
set -g display-panes-colour '#9893a5'

# Status bar configuration with Rosé Pine Dawn colors
set -g status-left '#[fg=#faf4ed,bg=#286983,bold]  #S #[fg=#286983,bg=#fffaf3]'
set -g status-right '#[fg=#9893a5]#{user}@#h #[fg=#dfdad9]│ #[fg=#286983]%a %b %d #[fg=#575279]%H:%M '
