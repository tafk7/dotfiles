# Vesper — Starship palette
# Vesper defines only three accents; blue/purple reuse existing colors rather
# than inventing new ones. See themes/vesper/colors.sh for the rationale.
[palettes.vesper]
bg          = "#101010"
bg_dim      = "#0a0a0a"
bg_alt      = "#1c1c1c"
fg          = "#ffffff"
fg_dim      = "#a0a0a0"
red         = "#ff8080"
orange      = "#ffc799"
yellow      = "#ffcfa8"
green       = "#99ffe4"
aqua        = "#99ffe4"
blue        = "#a0a0a0"
purple      = "#ffc799"
bracket     = "#ffc799"
bracket_alt = "#99ffe4"
