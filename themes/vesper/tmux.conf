# Vesper theme for tmux
# Based on https://github.com/datsfilipe/vesper.nvim
#
# Everything sits on #101010 so an OLED panel keeps the pixels near-off across
# the whole terminal, not just inside the editor.

# Status bar colors
set -g status-style bg='#101010',fg='#a0a0a0'

# Default pane canvas; applications that paint their own background override it.
set -g window-style bg='#101010',fg='#ffffff'
set -g window-active-style bg='#101010',fg='#ffffff'

# Window status colors
set -g window-status-style bg='#101010',fg='#505050'
set -g window-status-current-style bg='#1c1c1c',fg='#ffc799',bold
set -g window-status-activity-style bg='#101010',fg='#99ffe4'

# Pane border colors
set -g pane-border-style fg='#232323'
set -g pane-active-border-style fg='#ffc799'

# Message colors
set -g message-style bg='#1c1c1c',fg='#ffffff'
set -g message-command-style bg='#1c1c1c',fg='#ffffff'

# Copy mode colors
set -g mode-style bg='#232323',fg='#ffc799'

# Clock mode color
setw -g clock-mode-colour '#ffc799'

# Display panes colors
set -g display-panes-active-colour '#ffc799'
set -g display-panes-colour '#505050'

# Status bar configuration with Vesper colors
set -g status-left '#[fg=#101010,bg=#ffc799,bold]  #S #[fg=#ffc799,bg=#101010]'
set -g status-right '#[fg=#505050]#{user}@#h #[fg=#232323]│ #[fg=#ffc799]%a %b %d #[fg=#ffffff]%H:%M '
