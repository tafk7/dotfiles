# Catppuccin Latte theme for tmux (light)
# Based on https://github.com/catppuccin/tmux

# Status bar colors
set -g status-style bg='#e6e9ef',fg='#4c4f69'

# Default pane canvas; applications that paint their own background override it.
set -g window-style bg='#eff1f5',fg='#4c4f69'
set -g window-active-style bg='#eff1f5',fg='#4c4f69'

# Window status colors
set -g window-status-style bg='#e6e9ef',fg='#5c5f77'
set -g window-status-current-style bg='#ccd0da',fg='#4c4f69',bold
set -g window-status-activity-style bg='#e6e9ef',fg='#1e5ab6'

# Pane border colors
set -g pane-border-style fg='#bcc0cc'
set -g pane-active-border-style fg='#1e5ab6'

# Message colors
set -g message-style bg='#ccd0da',fg='#4c4f69'
set -g message-command-style bg='#ccd0da',fg='#4c4f69'

# Copy mode colors
set -g mode-style bg='#bcc0cc',fg='#4c4f69'

# Clock mode color
setw -g clock-mode-colour '#1e5ab6'

# Display panes colors
set -g display-panes-active-colour '#1e5ab6'
set -g display-panes-colour '#5c5f77'

# Status bar configuration with Catppuccin Latte colors
set -g status-left '#[fg=#eff1f5,bg=#1e5ab6,bold]  #S #[fg=#1e5ab6,bg=#e6e9ef]'
set -g status-right '#[fg=#5c5f77]#{user}@#h #[fg=#7c7f93]│ #[fg=#1e5ab6]%a %b %d #[fg=#4c4f69]%H:%M '
