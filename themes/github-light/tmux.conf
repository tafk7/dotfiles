# GitHub Light reference configuration. Runtime scoping uses palette.sh.
set -g status-style bg='#f6f8fa',fg='#24292f'
set -g window-style bg='#ffffff',fg='#24292f'
set -g window-active-style bg='#ffffff',fg='#24292f'
set -g window-status-style bg='#f6f8fa',fg='#57606a'
set -g window-status-current-style bg='#eaeef2',fg='#24292f',bold
set -g window-status-activity-style bg='#f6f8fa',fg='#0969da'
set -g pane-border-style fg='#d0d7de'
set -g pane-active-border-style fg='#0969da'
set -g message-style bg='#eaeef2',fg='#24292f'
set -g message-command-style bg='#eaeef2',fg='#24292f'
set -g mode-style bg='#d8dee4',fg='#24292f'
setw -g clock-mode-colour '#0969da'
set -g display-panes-active-colour '#0969da'
set -g display-panes-colour '#57606a'
set -g status-left '#[fg=#ffffff,bg=#0969da,bold]  #S #[fg=#0969da,bg=#f6f8fa]'
set -g status-right '#[fg=#57606a]#{user}@#h #[fg=#6e7781]│ #[fg=#0969da]%a %b %d #[fg=#24292f]%H:%M '
