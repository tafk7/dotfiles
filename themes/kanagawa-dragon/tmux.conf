# Kanagawa Dragon theme for tmux
# Based on https://github.com/rebelot/kanagawa.nvim (dragon variant)

# Status bar colors
set -g status-style bg='#181616',fg='#c5c9c5'

# Default pane canvas; applications that paint their own background override it.
set -g window-style bg='#181616',fg='#c5c9c5'
set -g window-active-style bg='#181616',fg='#c5c9c5'

# Window status colors
set -g window-status-style bg='#181616',fg='#a6a69c'
set -g window-status-current-style bg='#282727',fg='#c5c9c5',bold
set -g window-status-activity-style bg='#181616',fg='#8ba4b0'

# Pane border colors
set -g pane-border-style fg='#393836'
set -g pane-active-border-style fg='#8ba4b0'

# Message colors
set -g message-style bg='#282727',fg='#c5c9c5'
set -g message-command-style bg='#282727',fg='#c5c9c5'

# Copy mode colors
set -g mode-style bg='#393836',fg='#c5c9c5'

# Clock mode color
setw -g clock-mode-colour '#8ba4b0'

# Display panes colors
set -g display-panes-active-colour '#8ba4b0'
set -g display-panes-colour '#a6a69c'

# Status bar configuration with Kanagawa Dragon colors
set -g status-left '#[fg=#181616,bg=#8ba4b0,bold]  #S #[fg=#8ba4b0,bg=#181616]'
set -g status-right '#[fg=#a6a69c]#{user}@#h #[fg=#625e5a]│ #[fg=#8ba4b0]%a %b %d #[fg=#c5c9c5]%H:%M '
