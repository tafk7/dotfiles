# Gruvbox Material Light reference configuration. Runtime scoping uses palette.sh.
set -g status-style bg='#f2e5bc',fg='#3c3836'
set -g window-style bg='#fbf1c7',fg='#3c3836'
set -g window-active-style bg='#fbf1c7',fg='#3c3836'
set -g window-status-style bg='#f2e5bc',fg='#665c54'
set -g window-status-current-style bg='#e5d5ad',fg='#3c3836',bold
set -g window-status-activity-style bg='#f2e5bc',fg='#076678'
set -g pane-border-style fg='#d5c4a1'
set -g pane-active-border-style fg='#076678'
set -g message-style bg='#e5d5ad',fg='#3c3836'
set -g message-command-style bg='#e5d5ad',fg='#3c3836'
set -g mode-style bg='#d5c4a1',fg='#3c3836'
setw -g clock-mode-colour '#076678'
set -g display-panes-active-colour '#076678'
set -g display-panes-colour '#665c54'
set -g status-left '#[fg=#fbf1c7,bg=#076678,bold]  #S #[fg=#076678,bg=#f2e5bc]'
set -g status-right '#[fg=#665c54]#{user}@#h #[fg=#7c6f64]│ #[fg=#076678]%a %b %d #[fg=#3c3836]%H:%M '
