# Gruvbox Classic reference configuration. Runtime scoping uses palette.sh.
set -g status-style bg='#282828',fg='#ebdbb2'
set -g window-style bg='#282828',fg='#ebdbb2'
set -g window-active-style bg='#282828',fg='#ebdbb2'
set -g window-status-style bg='#282828',fg='#bdae93'
set -g window-status-current-style bg='#3c3836',fg='#ebdbb2',bold
set -g window-status-activity-style bg='#282828',fg='#fabd2f'
set -g pane-border-style fg='#504945'
set -g pane-active-border-style fg='#fabd2f'
set -g message-style bg='#3c3836',fg='#ebdbb2'
set -g message-command-style bg='#3c3836',fg='#ebdbb2'
set -g mode-style bg='#504945',fg='#ebdbb2'
setw -g clock-mode-colour '#b8bb26'
set -g display-panes-active-colour '#fabd2f'
set -g display-panes-colour '#bdae93'
set -g status-left '#[fg=#282828,bg=#b8bb26,bold]  #S #[fg=#b8bb26,bg=#282828]'
set -g status-right '#[fg=#bdae93]#{user}@#h #[fg=#665c54]│ #[fg=#b8bb26]%a %b %d #[fg=#ebdbb2]%H:%M '
