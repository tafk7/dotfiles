# Gruvbox Material Light Soft reference configuration. Runtime scoping uses palette.sh.
set -g status-style bg='#ebdbb2',fg='#3c3836'
set -g window-style bg='#f2e5bc',fg='#3c3836'
set -g window-active-style bg='#f2e5bc',fg='#3c3836'
set -g window-status-style bg='#ebdbb2',fg='#665c54'
set -g window-status-current-style bg='#dac9a5',fg='#3c3836',bold
set -g window-status-activity-style bg='#ebdbb2',fg='#076678'
set -g pane-border-style fg='#c9b98f'
set -g pane-active-border-style fg='#076678'
set -g message-style bg='#dac9a5',fg='#3c3836'
set -g message-command-style bg='#dac9a5',fg='#3c3836'
set -g mode-style bg='#c9b98f',fg='#3c3836'
setw -g clock-mode-colour '#076678'
set -g display-panes-active-colour '#076678'
set -g display-panes-colour '#665c54'
set -g status-left '#[fg=#f2e5bc,bg=#076678,bold]  #S #[fg=#076678,bg=#ebdbb2]'
set -g status-right '#[fg=#665c54]#{user}@#h #[fg=#7c6f64]│ #[fg=#076678]%a %b %d #[fg=#3c3836]%H:%M '
