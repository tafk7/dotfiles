# Everforest theme for tmux
# Based on https://github.com/sainnhe/everforest

# Status bar colors
set -g status-style bg='#2d353b',fg='#d3c6aa'

# Default pane canvas; applications that paint their own background override it.
set -g window-style bg='#2d353b',fg='#d3c6aa'
set -g window-active-style bg='#2d353b',fg='#d3c6aa'

# Window status colors
set -g window-status-style bg='#2d353b',fg='#859289'
set -g window-status-current-style bg='#3d484d',fg='#d3c6aa',bold
set -g window-status-activity-style bg='#2d353b',fg='#a7c080'

# Pane border colors
set -g pane-border-style fg='#475258'
set -g pane-active-border-style fg='#a7c080'

# Message colors
set -g message-style bg='#3d484d',fg='#d3c6aa'
set -g message-command-style bg='#3d484d',fg='#d3c6aa'

# Copy mode colors
set -g mode-style bg='#475258',fg='#d3c6aa'

# Clock mode color
setw -g clock-mode-colour '#a7c080'

# Display panes colors
set -g display-panes-active-colour '#a7c080'
set -g display-panes-colour '#859289'

# Status bar configuration with Everforest colors
set -g status-left '#[fg=#2d353b,bg=#a7c080,bold]  #S #[fg=#a7c080,bg=#2d353b]'
set -g status-right '#[fg=#859289]#{user}@#h #[fg=#475258]│ #[fg=#a7c080]%a %b %d #[fg=#d3c6aa]%H:%M '
