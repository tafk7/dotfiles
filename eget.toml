# eget.toml — declarative binary tool management
# Versions pinned to known-good releases.
#
# upgrade_only=true makes `eget --download-all` idempotent: a tool already
# present at its pinned tag is skipped (eget compares the pinned release's date
# against the installed binary's mtime), so re-running setup.sh no longer
# re-downloads everything. To move to a newer release, bump its `tag` and
# re-run — the newer release date triggers the download. To force a clean
# re-download (repair or downgrade), use `./setup.sh --bash --force`; downloads
# are staged and verified before atomically replacing the working binary.
#
# Architecture: filters must leave exactly one asset per supported arch
# (x86_64 and aarch64) after eget's native OS/arch detection. Never filter on an
# arch name, and never let a filter narrow to a single asset on its own — eget
# takes a lone filter match without checking its architecture.

[global]
target = "~/.local/bin"
upgrade_only = true

["starship/starship"]
tag = "v1.24.2"
# aarch64 ships only a musl build; musl exists for x86_64 too.
asset_filters = ["unknown-linux-musl", ".tar.gz"]

["eza-community/eza"]
tag = "v0.23.4"
# aarch64 also ships a gnu _no_libgit variant.
asset_filters = ["gnu", ".tar.gz", "^no_libgit"]

["junegunn/fzf"]
tag = "v0.67.0"

["ajeetdsouza/zoxide"]
tag = "v0.9.9"

["dandavison/delta"]
tag = "0.18.2"
asset_filters = [".tar.gz", "gnu"]

["aristocratos/btop"]
tag = "v1.4.6"

["dundee/gdu"]
tag = "v5.36.1"
# The release ships one archive per platform. Only amd64 has a _static build,
# so exclude it and let native detection pick amd64 or arm64.
asset_filters = ["gdu_linux_", ".tgz", "^_static"]
# The archive's binary is named for its target (gdu_linux_arm64); a file-path
# target renames it to plain `gdu` on install.
target = "~/.local/bin/gdu"

["charmbracelet/glow"]
tag = "v2.1.1"
asset_filters = [".tar.gz", "^sbom"]

["jesseduffield/lazygit"]
tag = "v0.59.0"

["cli/cli"]
tag = "v2.100.0"
asset_filters = ["linux_", ".tar.gz"]

["astral-sh/uv"]
tag = "0.10.0"
asset_filters = [".tar.gz", "gnu"]

["chmln/sd"]
tag = "v1.1.0"
asset_filters = ["unknown-linux-musl"]

["sharkdp/bat"]
tag = "v0.26.1"
asset_filters = ["unknown-linux-gnu", ".tar.gz"]

["sharkdp/fd"]
tag = "v10.4.2"
asset_filters = ["unknown-linux-gnu", ".tar.gz"]

["BurntSushi/ripgrep"]
tag = "15.2.0"
# x86_64 ships only musl; aarch64 ships gnu and musl. musl is common to both.
asset_filters = ["unknown-linux-musl", ".tar.gz"]

["direnv/direnv"]
tag = "v2.37.1"
# Release ships bare per-arch binaries (direnv.linux-amd64); a file-path
# target renames it to plain `direnv` on install (same trick as gdu).
asset_filters = ["direnv.linux-"]
target = "~/.local/bin/direnv"

["koalaman/shellcheck"]
tag = "v0.11.0"
asset_filters = [".linux.", ".tar.xz"]

# Installed on demand when a supported agent-badge CLI is selected.
["jqlang/jq"]
tag = "jq-1.8.1"
asset_filters = ["jq-linux-"]
target = "~/.local/bin/jq"

# NOTE: Codex is an "ai" tier tool and is intentionally NOT listed here. Its
# dedicated installer uses OpenAI's standalone installer so that `--bash`'s
# `eget --download-all` never pulls it in — AI CLIs install only under --ai/--full.

["mame/wsl2-ssh-agent"]
tag = "v0.9.7"
# Release ships bare binaries: wsl2-ssh-agent (x86_64) and wsl2-ssh-agent-arm64.
# Neither name carries an OS, so eget's native detection cannot choose between
# them. Callers pass per-arch --asset flags from tool_eget_asset_args
# (lib/registry.sh), which override this filter.
asset_filters = ["wsl2-ssh-agent"]
