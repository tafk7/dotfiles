# Modern Tmux Configuration - Power User Setup
# Part of dotfiles - optimized for neovim/shell integration

# ==============================================================================
# Core Settings
# ==============================================================================

# Better terminal support
set -g default-terminal "tmux-256color"
set -ga terminal-features ",xterm-256color:RGB"  # True color (modern; replaces Tc override)
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'  # Cursor shape support
set -ga terminal-overrides ',xterm*:khome=\EOH:kend=\EOF'  # Home/End (xterm sends \EOH/\EOF, tmux-256color expects \E[1~/\E[4~)
set -ga terminal-overrides ',xterm*:kDC5=\E[3;5~'        # Ctrl+Delete (forward delete-word)

# Extended key support (tmux 3.2+) — enables Ctrl+Shift differentiation
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Performance and behavior
set -sg escape-time 10                       # Near-zero (0 causes escape artifacts in VS Code)
set -g history-limit 50000                   # Enough for Claude sessions (avoid 100K+ — reflow lag)
set -g display-time 4000                     # Status messages display longer
set -g status-interval 15                    # Lower refresh (reduces overhead during heavy TUI output)
set -g focus-events on                       # Focus events for vim autoread
# OSC 52 clipboard is driven by bin/tmux-copy, not by tmux itself — see the copy
# bindings below. `off` (not `external`: that still sets the clipboard) stops
# tmux emitting an unbounded escape sequence on every copy, which stalled the
# terminal for seconds on large selections.
set -g set-clipboard off
set -g @clipboard-limit 65536                # bytes of selection sent to the clipboard
# allow-passthrough is tmux 3.3+; 3.2a (Ubuntu 22.04) errors on it at load.
# Version gate: if 3.3 sorts first against the running version, we're >= 3.3.
if-shell -b '[ "$(printf "%s\n3.3" "$(tmux -V | cut -d" " -f2 | tr -cd "0-9.")" | sort -V | head -1)" = "3.3" ]' \
    'set -g allow-passthrough on'            # OSC 52, DEC 2026 sync output
set -g aggressive-resize on                  # Resize to smallest client actually viewing

# Window and pane behavior
set -g base-index 1                          # Start windows at 1
setw -g pane-base-index 1                    # Start panes at 1
set -g renumber-windows on                   # Renumber windows when one is closed
setw -g automatic-rename on                  # Rename window to current program
# Auto-name from directory basename, not pane_current_command: every window here
# runs `claude`, so the default format renders them all identically. Only applies
# to windows that were never manually renamed (naming a window turns this off).
setw -g automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on                         # Set terminal title
set -g set-titles-string '#S: #W'           # Title format

# ==============================================================================
# Key Bindings — Prefix
# ==============================================================================

unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ==============================================================================
# No-Prefix Bindings (left-hand optimized, instant)
#
# Layout mirrors left half of split keyboard:
#   Alt+ESDF         = pane navigate (arrow diamond)
#   Alt+1–5          = window jump
#   Alt+Shift+Q/W/A/T/X/G = window/pane operations
#
# Every no-prefix binding also has a C-a prefix mirror for laptops.
# ==============================================================================

# Pane navigation — Alt+ESDF (no prefix) + C-a mirror
# Unbind the old shifted variants explicitly so a config reload removes them.
unbind -n M-E
unbind -n M-S
unbind -n M-D
unbind -n M-F
bind -n M-e select-pane -U
bind -n M-s select-pane -L
bind -n M-d select-pane -D
bind -n M-f select-pane -R

# Window jump — Alt+number
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-0 select-window -t 10

# Window step — Alt+w/r (no prefix, repeatable). W and R flank E on the top row,
# so they read as left/right shoulders around the ESDF diamond. Lowercase: no Shift.
bind -n -r M-w previous-window
bind -n -r M-r next-window

# Window/pane operations — Alt+Shift+key (no prefix) + C-a mirror
bind -n M-Q last-window                      # Toggle last window
bind -n M-W choose-tree -Zw                  # Window picker
bind -n M-A resize-pane -Z                   # Zoom pane toggle
bind -n M-T new-window -a -c "#{pane_current_path}"   # New window after current
bind -n M-X confirm-before -p "kill-pane? (y/n)" kill-pane  # Kill pane (with confirm)
bind -n M-G setw synchronize-panes \; display 'synchronize-panes #{?synchronize-panes,on,off}'

# ==============================================================================
# Prefix Bindings
# ==============================================================================

# Pane navigation — C-a + arrow (prefix mirror for laptop use)
bind Up select-pane -U
bind Left select-pane -L
bind Down select-pane -D
bind Right select-pane -R

# Application passthrough for Meta keys claimed by no-prefix pane navigation.
# Example: C-a then Alt+f sends the shell/fzf forward-word command.
bind M-e send-keys M-e
bind M-s send-keys M-s
bind M-d send-keys M-d
bind M-f send-keys M-f

# Pane resize — C-a + Shift+Arrow (repeatable)
bind -r S-Up resize-pane -U 5
bind -r S-Left resize-pane -L 5
bind -r S-Down resize-pane -D 5
bind -r S-Right resize-pane -R 5

# Window/pane operations — C-a + key (mirrors no-prefix)
bind a resize-pane -Z                        # Zoom pane toggle
bind t new-window -a -c "#{pane_current_path}"  # New window after current
bind w choose-tree -Zw                       # Window picker
bind g setw synchronize-panes \; display 'synchronize-panes #{?synchronize-panes,on,off}'

# Splits (preserve current path)
unbind '"'
unbind %
bind - split-window -v -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind b split-window -h -c "#{pane_current_path}"  # Left-hand alternative for h-split

# Window/session operations
bind c command-prompt "rename-window '%%'"    # Rename window (turns automatic-rename off)
bind M-, setw automatic-rename on \; display 'automatic-rename on'  # Revert to auto-naming
bind C new-session
bind x confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind X confirm-before -p "kill-window #I:#W and all panes? (y/n)" kill-window
bind e switch-client -n                      # Next session
bind E switch-client -p                      # Previous session
bind s choose-tree -Zs                       # Session chooser

# Pane operations
bind j command-prompt -p "join pane from:" "join-pane -s '%%'"
bind q display-panes -d 3000                 # Show pane numbers
bind Space next-layout
bind C-Space previous-layout

# Copy mode and clipboard
bind v copy-mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle

# Clipboard: bin/tmux-copy emits OSC 52 straight to the attached client's tty,
# but only for selections under @clipboard-limit. The old chain here tried
# clip.exe -> wl-copy -> xclip; on a Windows->ssh->Linux box none of them work
# (no clip.exe, no wl-copy, and xclip has no $DISPLAY to reach), so OSC 52 is
# the only real path and the size gate is what keeps it from freezing the
# terminal. The tmux buffer is set regardless, so prefix+] pastes at any size.
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "$HOME/dotfiles/bin/tmux-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "$HOME/dotfiles/bin/tmux-copy"
bind p paste-buffer
bind P run "if [ -x '/mnt/c/Program Files/PowerShell/7/pwsh.exe' ]; then '/mnt/c/Program Files/PowerShell/7/pwsh.exe' -NoProfile -Command Get-Clipboard | tr -d '\\r'; elif [ -x /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe ]; then /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoProfile -Command Get-Clipboard | tr -d '\\r'; elif command -v wl-paste >/dev/null 2>&1; then wl-paste; elif command -v xclip >/dev/null 2>&1; then xclip -o -sel clipboard; else printf ''; fi | tmux load-buffer - ; tmux paste-buffer"

# Utility
bind r source-file ~/.tmux.conf \; display-message "Tmux config reloaded!"
bind C-l if-shell -F '#{alternate_on}' \
    'send-keys C-l' \
    'send-keys -R C-l ; clear-history'
bind M-c run-shell \
    'for p in $(tmux list-panes -s -F "#{pane_id}"); do \
       tmux clear-history -t "$p"; done' \; \
    display "All pane histories cleared"

# ==============================================================================
# Mouse Support
# ==============================================================================

set -g mouse on

# Mouse drag to copy
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"

# ==============================================================================
# Visual Styling - Dynamic Theme Loading
# ==============================================================================

# Fallback status content, set BEFORE the theme is sourced. Every theme defines
# status-left/right, so this only shows when no theme is installed. Ordering is
# the whole mechanism: last write wins, so the theme overrides these.
# (Previously these sat after the theme behind an `if-shell [ -z "$status_left" ]`
# test. $status_left is a shell variable that is never set, so the test always
# passed and the defaults silently clobbered every theme's status bar.)
set -g status-left '#[bold]  #S │ '
set -g status-right '#{user}@#h │ %a %b %d %H:%M '

# Source theme configuration (created by theme-switcher --init during setup)
if-shell "test -f ~/.tmux/theme.conf" \
    "source-file ~/.tmux/theme.conf"

# ==============================================================================
# Status Bar Configuration
# ==============================================================================

set -g status-position bottom
set -g status-justify left

# Status bar length
set -g status-left-length 40
set -g status-right-length 80

# Status content comes from the theme file (see "Fallback status content" above,
# which runs before the theme is sourced so the theme can override it).

# Window status format
#
# The agent badge (#{E:@cc_win_badge}) is NOT written here. The agent-badge
# plugin injects it into both formats below when it wires itself up -- see the
# run-shell further down. Keeping it out of this file is what lets the plugin be
# installed on a machine that has no dotfiles: it is distributed through Claude
# Code's and Codex's own plugin marketplaces, from plugins/agent-badge in this
# repo. See that directory's README for the glyph legend and the state machine.
#
# synchronize-panes is a per-window option, so put its warning on each affected
# window rather than only in status-right for the currently selected window.
# Reverse video inherits every theme's palette while remaining hard to miss.
set -g window-status-format ' #I:#W#F#{?synchronize-panes, #[reverse]SYNC#[noreverse],} '
set -g window-status-current-format ' #I:#W#F#{?synchronize-panes, #[reverse]SYNC#[noreverse],} '
set -g window-status-separator ''

# Agent badge (plugins/agent-badge)
#
# Hands the tmux server to the plugin, which installs the badge placeholder into
# the two window-status formats above and appends its pane-focus-in /
# pane-exited hooks. All of that is idempotent and guarded -- appended hooks
# otherwise multiply on every `source-file`, and prefix+r is bound to exactly
# that.
#
# This line is optional. The plugin self-wires from its SessionStart hook when
# it finds the badge missing, which is how it works on a machine with no
# dotfiles. Doing it here instead means the badge is present the moment tmux
# starts rather than when the first agent does, and it keeps the wiring
# greppable from this file.
#
# To remove it: plugins/agent-badge/agent-badge.tmux unwire
if-shell '[ -x "$HOME/dotfiles/plugins/shared/agent-badge.tmux" ]' \
    'run-shell "$HOME/dotfiles/plugins/shared/agent-badge.tmux wire"'

# ==============================================================================
# Activity and Monitoring
# ==============================================================================

# Disable activity monitoring (less noise)
setw -g monitor-activity off
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-bell off

# Swallow bells instead of forwarding them to the terminal. Default is
# `bell-action any`, which passes a real BEL through; Windows Terminal responds
# by raising/focusing the window, so every Claude turn completion yanked focus
# to whichever window finished. The window badge is the completion signal now.
set -g bell-action none
