# tmux configuration (dotfiles)

# ==============================================================================
# Core Settings
# ==============================================================================

# Capture the checkout location once in the server environment; helpers below
# expand it, so custom paths (including spaces) work. The bootstrap location is
# only a fallback for clients that did not inherit DOTFILES_DIR.
if-shell -F '#{==:#{E:DOTFILES_DIR},}' \
    'set-environment -g DOTFILES_DIR "$HOME/dev/dotfiles"' \
    'set-environment -g DOTFILES_DIR "$DOTFILES_DIR"'

# A server started from a dotfiles shell inherits its exported load guards, and
# every new pane would then skip the environment setup and keep the values the
# server started with. Drop them so each pane computes its own.
set-environment -gu _DOTFILES_BASE_ENV
set-environment -gu _DOTFILES_ENV_LOADED

set -g default-terminal "tmux-256color"

# The lines below append (-ga/-as), so unset both lists first to keep a reload
# idempotent. The scope flag must match the option (overrides is session-scoped,
# features server-scoped) or the unset silently does nothing.
set -gu terminal-overrides
set -su terminal-features

set -ga terminal-features ",xterm-256color:RGB"  # True color (modern; replaces Tc override)
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'  # Cursor shape support
set -ga terminal-overrides ',xterm*:khome=\EOH:kend=\EOF'  # Home/End (xterm sends \EOH/\EOF, tmux-256color expects \E[1~/\E[4~)
set -ga terminal-overrides ',xterm*:kDC5=\E[3;5~'        # Ctrl+Delete (forward delete-word)
# Windows Terminal emits these exact sequences for physical Alt+Paste/Copy.
set -ga terminal-overrides ',xterm*:kIC4=\E[2;4~:kIC7=\E[2;7~'

# Extended key support (tmux 3.2+) — enables Ctrl+Shift differentiation
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Synchronized output (DEC 2026). tmux's xterm* feature set omits it, so
# full-screen TUIs visibly repaint mid-frame. Terminals without it ignore the
# DECSET.
set -as terminal-features 'xterm*:sync'

# Performance and behavior
set -sg escape-time 10                       # Near-zero (0 causes escape artifacts in VS Code)
set -g repeat-time 500                       # Never leave a client stuck in the repeat key table
set -g history-limit 50000                   # Enough for Claude sessions (avoid 100K+ — reflow lag)
set -g display-time 4000                     # Status messages display longer
set -g status-interval 15                    # Lower refresh (reduces overhead during heavy TUI output)
set -g status-keys emacs                     # Shell-like prompts; Escape cancels
set -g focus-events on                       # Focus events for vim autoread
# OSC 52 is driven by bin/tmux-copy (see "Clipboard" below), not by tmux. `off`
# rather than `external`, which still emits an unbounded escape sequence on
# every copy and stalls the terminal on large selections.
set -g set-clipboard off
set -goq @clipboard-export on                # Pause / prefix+E; -o keeps the value across reloads
set -gu @clipboard-osc52                     # Retired test flag
set -g @clipboard-limit 65536                # bytes of selection sent to the clipboard
# allow-passthrough is tmux 3.3+; 3.2a (Ubuntu 22.04) errors on it at load.
# Version gate: if 3.3 sorts first against the running version, we're >= 3.3.
if-shell -b '[ "$(printf "%s\n3.3" "$(tmux -V | cut -d" " -f2 | tr -cd "0-9.")" | sort -V | head -1)" = "3.3" ]' \
    'set -g allow-passthrough on'            # OSC 52, DEC 2026 sync output
set -g window-size latest                    # Follow the most recently active client
setw -g aggressive-resize off                # Keep inactive windows in sync with session geometry

# Window and pane behavior
set -g base-index 1                          # Start windows at 1
setw -g pane-base-index 1                    # Start panes at 1
set -g renumber-windows on                   # Renumber windows when one is closed
setw -g automatic-rename on                  # Rename window to current program
# Name windows by directory, not command: most windows run the same agent CLI.
# Renaming a window manually turns this off for it.
setw -g automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on                         # Set terminal title
set -g set-titles-string '#S: #W'           # Title format

# ==============================================================================
# Key Bindings — Prefix
# ==============================================================================

unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ==============================================================================
# No-Prefix Bindings (left-hand optimized, instant)
#
# Layout mirrors left half of split keyboard:
#   Alt+ESDF         = pane navigate (arrow diamond); S/F cross windows
#   Alt+Shift+S/F    = first / last window
#   Alt+1–0          = window jump (0 selects window 10)
#   Alt+Shift+W/T     = window/pane operations
#
# Core no-prefix actions retain prefix alternatives for laptop use.
# ==============================================================================

# Pane navigation — Alt+ESDF and Alt+arrows (no prefix) + C-a mirror.
# Vertical moves stop at the layout's edge. Horizontal moves cross to the
# neighboring window at the outer edge, landing on its facing pane, and wrap
# around past the first and last window. Alt+Shift+S/F jump to the first and
# last window.
# Unbind the shifted variants so a reload clears them from a live server.
unbind -n M-E
unbind -n M-D
bind -n M-S select-window -t '{start}'
bind -n M-F select-window -t '{end}'
bind -n M-e if-shell -F '#{pane_at_top}' {} { select-pane -U }
bind -n M-d if-shell -F '#{pane_at_bottom}' {} { select-pane -D }
bind -n M-s if-shell -F '#{pane_at_left}' {
    if-shell -F '#{==:#{session_windows},1}' {} { previous-window ; select-pane -t '{right}' }
} { select-pane -L }
bind -n M-f if-shell -F '#{pane_at_right}' {
    if-shell -F '#{==:#{session_windows},1}' {} { next-window ; select-pane -t '{left}' }
} { select-pane -R }
bind -n M-Up if-shell -F '#{pane_at_top}' {} { select-pane -U }
bind -n M-Down if-shell -F '#{pane_at_bottom}' {} { select-pane -D }
bind -n M-Left if-shell -F '#{pane_at_left}' {
    if-shell -F '#{==:#{session_windows},1}' {} { previous-window ; select-pane -t '{right}' }
} { select-pane -L }
bind -n M-Right if-shell -F '#{pane_at_right}' {
    if-shell -F '#{==:#{session_windows},1}' {} { next-window ; select-pane -t '{left}' }
} { select-pane -R }

# Window jump — Alt+number
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-0 select-window -t 10

# Alt+W/R used to step windows; Alt+S/F cross windows now, so they go back to
# the applications (Alt+R is Codex's raw-output toggle).
unbind -n M-w
unbind -n M-r

# Window/pane operations — Alt+Shift+key (no prefix) + C-a mirror
bind -n M-W choose-tree -Zw                  # Window picker
bind -n M-T new-window -a -c "#{pane_current_path}"   # New window after current
unbind -n M-G                                # Synchronization is prefix/menu only
unbind -n M-Q                                # Window stepping/picker replace last-window
unbind -n M-A                                # Zoom is prefix+z only
unbind -n M-X                                # Kill actions require the prefix

# ==============================================================================
# Prefix Bindings
# ==============================================================================

# Pane navigation — C-a + arrow (prefix mirror for laptop use)
bind Up select-pane -U
bind Left select-pane -L
bind Down select-pane -D
bind Right select-pane -R

# Application passthrough for Meta keys claimed by no-prefix pane navigation.
# Example: C-a then Alt+f sends the shell/fzf forward-word command.
bind M-e send-keys M-e
bind M-s send-keys M-s
bind M-d send-keys M-d
bind M-f send-keys M-f

# Pane resize — C-a + Shift+Arrow (repeatable)
bind -r S-Up resize-pane -U 5
bind -r S-Left resize-pane -L 5
bind -r S-Down resize-pane -D 5
bind -r S-Right resize-pane -R 5

# Window/pane operations — C-a + key
unbind a
bind z resize-pane -Z                        # Zoom pane toggle
bind t new-window -a -c "#{pane_current_path}"  # New window after current
bind w choose-tree -Zw                       # Window picker
bind g setw synchronize-panes \; display 'synchronize-panes #{?synchronize-panes,on,off}'

# Splits (preserve current path)
unbind '"'
unbind %
unbind \\
unbind b
bind - split-window -v -c "#{pane_current_path}"
bind = split-window -h -c "#{pane_current_path}"

# Window/session operations
# A blank name restores directory-based automatic naming.
unbind c
bind n command-prompt -p "rename window (blank = automatic):" { if-shell -F "#{==:%%,}" { setw automatic-rename on } { rename-window "%%" } }
unbind M-,                                   # Blank rename restores auto-naming
bind i command-prompt -p "insert window at index:" {
    if-shell -F "#{||:#{==:%%,-1},#{>:%%,#{session_windows}}}" {
        if-shell -F "#{==:#{window_index},#{session_windows}}" {
            display-message "window already at end"
        } {
            move-window -a -t ":#{session_windows}"
        }
    } {
        if-shell -F "#{<:%%,1}" {
            display-message "invalid window index: %%"
        } {
            if-shell -F "#{==:%%,#{window_index}}" {
                display-message "window already at index %%"
            } {
                if-shell -F "#{<:%%,#{window_index}}" {
                    move-window -b -t ":%%"
                } {
                    move-window -a -t ":%%"
                }
            }
        }
    }
}
bind C new-session
unbind &
bind x confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind X confirm-before -p "kill-window #I:#W and all panes? (y/n)" kill-window
bind s choose-tree -Zs                       # Session chooser

# Pane operations — spatial join/leave pair
bind j if-shell -F '#{>:#{window_index},1}' \
    'join-pane -h -s "#{pane_id}" -t :-1' \
    'display-message "Cannot join: no window to the left"'
bind l if-shell -F '#{>:#{window_panes},1}' \
    'break-pane -a' \
    'display-message "Cannot leave: this is the only pane"'
unbind '!'
bind q display-panes -d 3000                 # Show pane numbers
bind Space next-layout
bind C-Space previous-layout

# Copy mode and clipboard
bind -n C-M-IC copy-mode                     # Alt+physical Copy key
bind -n M-S-IC paste-buffer -p               # Alt+physical Paste key
# Copy-mode on what the pane shows now, without moving: in an agent, the live
# screen, including the prompt being typed. Review (below) is prefix+f.
bind v if-shell -F '#{pane_in_mode}' 'send -X cancel' 'copy-mode'

# Compose: Alt+V opens a Neovim pane under this one for writing a prompt, or
# moves focus between the two; Ctrl+S there pastes and submits (bin/tmux-compose).
# In Claude, Alt+V and Claude's Ctrl+G bring the prompt box along, and quitting
# the pane puts it back; Ctrl+Shift+G opens the prompt in nvim in Claude's place.
# Elsewhere Ctrl+Shift+G goes on as Ctrl+G: tmux 3.4 would send its name.
bind -n M-v run-shell -b '"$DOTFILES_DIR/bin/tmux-compose" toggle "#{pane_id}"'
bind -n C-S-G if-shell -F '#{&&:#{==:#{pane_current_command},claude},#{==:#{pane_in_mode},0}}' \
    'set -p @compose-editor fullscreen ; send-keys C-g' 'send-keys C-g'

# Browse: PgUp and Ctrl+Home scroll a shell's history in copy-mode, which exits
# at the bottom. Fullscreen and mouse-aware apps (agents, less, inline fzf)
# scroll themselves, so they get the keys, as with the wheel below. Inside
# copy-mode its own table takes them.
bind -n PPage if-shell -F '#{||:#{alternate_on},#{mouse_any_flag}}' { send-keys PPage } { copy-mode -eu }
bind -n C-Home if-shell -F '#{||:#{alternate_on},#{mouse_any_flag}}' { send-keys C-Home } {
    copy-mode -e ; send-keys -X history-top
}

# Plain Copy key. WezTerm forwards it only when it has no selection of its own.
# Copy mode copies its selection (bound below with y); otherwise hand the key to
# Claude and swallow it elsewhere, so no escape sequence reaches a shell.
# Claude's keybindings have no name for Insert, so it gets Ctrl+Shift+C, its
# selection:copy (which WezTerm keeps for itself) -- but only while Claude has
# asked for extended keys. Otherwise tmux would send that as a plain Ctrl+C,
# which interrupts. pane_key_mode is tmux 3.5+; older servers swallow the key.
bind -n C-IC if-shell -F '#{&&:#{==:#{pane_current_command},claude},#{==:#{pane_key_mode},Ext 2}}' \
    'send-keys C-S-c'

# Ctrl+C in Claude sends Esc. Claude's own Ctrl+C at an idle prompt stops every
# background agent at once, without asking, and Claude won't let the key be
# rebound; Esc interrupts the running turn and leaves background agents alone.
# prefix+Ctrl+C sends a real Ctrl+C (clear the input, exit, stop the agents);
# Claude's Ctrl+X Ctrl+K, pressed twice, also stops them.
bind -n C-c if-shell -F '#{&&:#{==:#{pane_current_command},claude},#{==:#{pane_in_mode},0}}' \
    'send-keys Escape' 'send-keys C-c'
bind C-c send-keys C-c

# Word and line deletes in Claude match the shell, Codex and nvim: Ctrl deletes
# a word, Alt to the start or end of the line. Claude hard-codes these keys
# (Ctrl+Backspace and Ctrl+Delete delete a character, Alt+Backspace a word), so
# tmux sends the keys Claude has for each instead. Ctrl+Backspace arrives as
# C-h, or as C-BSpace from a terminal reporting extended keys. Other panes, and
# Claude panes in copy-mode, get the key unchanged, except that C-BSpace goes
# on as C-h: tmux would otherwise send it as nothing (3.4) or as its name (3.7).
bind -n C-h if-shell -F '#{&&:#{==:#{pane_current_command},claude},#{==:#{pane_in_mode},0}}' \
    'send-keys M-BSpace' 'send-keys C-h'
bind -n C-BSpace if-shell -F '#{&&:#{==:#{pane_current_command},claude},#{==:#{pane_in_mode},0}}' \
    'send-keys M-BSpace' 'send-keys C-h'
bind -n C-DC if-shell -F '#{&&:#{==:#{pane_current_command},claude},#{==:#{pane_in_mode},0}}' \
    'send-keys M-d' 'send-keys C-DC'
bind -n M-BSpace if-shell -F '#{&&:#{==:#{pane_current_command},claude},#{==:#{pane_in_mode},0}}' \
    'send-keys C-u' 'send-keys M-BSpace'
# The same key, Esc DEL, as tmux 3.6 reads it: Meta and the DEL byte, which no
# key name means there (it reads "M-C-?" as Ctrl, Meta, and ?).
bind -n "M-\177" if-shell -F '#{&&:#{==:#{pane_current_command},claude},#{==:#{pane_in_mode},0}}' \
    'send-keys C-u' 'send-keys "M-\177"'
bind -n M-DC if-shell -F '#{&&:#{==:#{pane_current_command},claude},#{==:#{pane_in_mode},0}}' \
    'send-keys C-k' 'send-keys M-DC'

# Review: ScrollLock (firmware F17; WezTerm sends Shift+F5) or prefix+f. A
# frozen view of the pane: copy-mode for shells, Claude's transcript dumped into
# history, Codex's transcript search, OpenCode's session exported into an nvim
# popup (bin/tmux-review). Leaving a Claude review sends Esc, which returns
# Claude to fullscreen; the hook runs in the pane that changed mode.
bind f run-shell -b '"$DOTFILES_DIR/bin/tmux-review" toggle "#{pane_id}" "#{client_name}"'
bind -n S-F5 run-shell -b '"$DOTFILES_DIR/bin/tmux-review" toggle "#{pane_id}" "#{client_name}"'
bind -T copy-mode-vi S-F5 send -X cancel
set-hook -g pane-mode-changed {
    if-shell -F '#{&&:#{==:#{@review},claude},#{==:#{pane_in_mode},0}}' {
        set -pu @review ; send-keys Escape
    }
}

setw -g mode-keys vi
unbind -T copy-mode-vi Space
unbind -T copy-mode-vi V
unbind -T copy-mode-vi C-v
unbind -T copy-mode-vi c
bind -T copy-mode-vi v if-shell -F '#{selection_present}' \
    'send -X clear-selection' \
    'send -X begin-selection'
bind -T copy-mode-vi Escape if-shell -F '#{selection_present}' \
    'send -X clear-selection' \
    'send -X cancel'
bind -T copy-mode-vi q send -X cancel

# Review keys (issues/scrollback-copy-compose.md §3.3), the ESDF diamond as
# arrows. Plain moves; Shift extends the selection, starting one if needed; Ctrl
# moves by word (S/F) or prompt (E/D). Home/End go to the ends of the line,
# Ctrl+Home/End to the ends of history. Prompt jumps need OSC 133 marks from the
# shell; Claude's transcript has none, so a Claude review searches for its ❯.
# Displaced vi defaults: e, f/F/t/T, o, D (copied to end of line and exited),
# Ctrl+E/D/F. j/k/g/G still work.
bind -T copy-mode-vi e send -X cursor-up
bind -T copy-mode-vi d send -X cursor-down
bind -T copy-mode-vi s send -X cursor-left
bind -T copy-mode-vi f send -X cursor-right
bind -T copy-mode-vi E if-shell -F '#{selection_present}' { send -X cursor-up } { send -X begin-selection ; send -X cursor-up }
bind -T copy-mode-vi D if-shell -F '#{selection_present}' { send -X cursor-down } { send -X begin-selection ; send -X cursor-down }
bind -T copy-mode-vi S if-shell -F '#{selection_present}' { send -X cursor-left } { send -X begin-selection ; send -X cursor-left }
bind -T copy-mode-vi F if-shell -F '#{selection_present}' { send -X cursor-right } { send -X begin-selection ; send -X cursor-right }
bind -T copy-mode-vi S-Up if-shell -F '#{selection_present}' { send -X cursor-up } { send -X begin-selection ; send -X cursor-up }
bind -T copy-mode-vi S-Down if-shell -F '#{selection_present}' { send -X cursor-down } { send -X begin-selection ; send -X cursor-down }
bind -T copy-mode-vi S-Left if-shell -F '#{selection_present}' { send -X cursor-left } { send -X begin-selection ; send -X cursor-left }
bind -T copy-mode-vi S-Right if-shell -F '#{selection_present}' { send -X cursor-right } { send -X begin-selection ; send -X cursor-right }
bind -T copy-mode-vi C-s send -X previous-word
bind -T copy-mode-vi C-f send -X next-word-end
bind -T copy-mode-vi C-Left send -X previous-word
bind -T copy-mode-vi C-Right send -X next-word-end
bind -T copy-mode-vi C-e if-shell -F '#{==:#{@review},claude}' { send -X search-backward '^❯ ' } { send -X previous-prompt }
bind -T copy-mode-vi C-d if-shell -F '#{==:#{@review},claude}' { send -X search-forward '^❯ ' } { send -X next-prompt }
bind -T copy-mode-vi C-Up if-shell -F '#{==:#{@review},claude}' { send -X search-backward '^❯ ' } { send -X previous-prompt }
bind -T copy-mode-vi C-Down if-shell -F '#{==:#{@review},claude}' { send -X search-forward '^❯ ' } { send -X next-prompt }
bind -T copy-mode-vi Home send -X start-of-line
bind -T copy-mode-vi End send -X end-of-line
bind -T copy-mode-vi C-Home send -X history-top
bind -T copy-mode-vi C-End send -X history-bottom
# Review starts at the bottom, so / searches upward; n/N repeat in its direction.
bind -T copy-mode-vi / command-prompt -i -T search -p '(search up)' { send -X search-backward-incremental '%%' }
bind -T copy-mode-vi ? command-prompt -i -T search -p '(search down)' { send -X search-forward-incremental '%%' }
bind -T copy-mode-vi o run-shell -b '"$DOTFILES_DIR/bin/tmux-review" open "#{pane_id}" "#{client_name}"'
unbind -T copy-mode-vi t
unbind -T copy-mode-vi T

# Numeric repeat prompts can survive awkward reconnect/input sequences and trap
# the client at a `(repeat)` prompt. Counts are not part of this copy workflow.
unbind -T copy-mode-vi 1
unbind -T copy-mode-vi 2
unbind -T copy-mode-vi 3
unbind -T copy-mode-vi 4
unbind -T copy-mode-vi 5
unbind -T copy-mode-vi 6
unbind -T copy-mode-vi 7
unbind -T copy-mode-vi 8
unbind -T copy-mode-vi 9

# Clipboard. Every copy sets the tmux buffer, so prefix+p pastes at any size,
# and bin/tmux-copy sends it on to the attached clients' clipboard as OSC 52,
# up to @clipboard-limit. Over Windows -> ssh -> Linux, OSC 52 is the only path
# to the client clipboard, and the size gate keeps it from freezing the
# terminal. Copy-mode copies reach it as copy-command; buffers loaded from
# outside (nvim yanks, shell cuts, Claude) through the after-load-buffer hook,
# which skips buffers loaded under a name (-b). #{buffer_name} there is the
# newest automatic buffer, not the loaded one; #{hook_flag_b} is the name.
# While @clipboard-export is off, both stop; prefix+e and `yo` still export.
set -s copy-command '"$DOTFILES_DIR/bin/tmux-copy"'
set-hook -g after-load-buffer {
    run-shell -b '"$DOTFILES_DIR/bin/tmux-copy" --hook "#{hook_flag_b}"'
}
bind E set -gF @clipboard-export '#{?#{==:#{@clipboard-export},off},on,off}' \; \
    display-message 'clipboard export #{@clipboard-export}'
bind -n S-F6 set -gF @clipboard-export '#{?#{==:#{@clipboard-export},off},on,off}' \; \
    display-message 'clipboard export #{@clipboard-export}'

bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi C-IC send -X copy-pipe-and-cancel
bind -T copy-mode-vi C-M-IC send -X copy-pipe-and-cancel
unbind -T copy-mode-vi Enter
unbind -T copy-mode-vi C-j

# Tmux mouse selection is entirely Alt-gated. Ordinary clicks only focus or
# reach the application; Alt double/triple-click yank a word/line immediately.
bind -T copy-mode-vi MouseDown1Pane select-pane -t =
bind -T copy-mode-vi MouseDrag1Pane select-pane -t =
bind -T copy-mode-vi MouseDragEnd1Pane select-pane -t =
bind -T copy-mode-vi DoubleClick1Pane select-pane
bind -T copy-mode-vi TripleClick1Pane select-pane
bind -T copy-mode-vi M-MouseDown1Pane select-pane
bind -T copy-mode-vi M-MouseDrag1Pane select-pane \; send -X begin-selection
bind -T copy-mode-vi M-MouseDragEnd1Pane send -X copy-pipe-and-cancel
bind -T copy-mode-vi M-DoubleClick1Pane select-pane \; send -X select-word \; send -X copy-pipe-and-cancel
bind -T copy-mode-vi M-TripleClick1Pane select-pane \; send -X select-line \; send -X copy-pipe-and-cancel

bind -n DoubleClick1Pane select-pane -t = \; if-shell -F '#{mouse_any_flag}' 'send-keys -M' 'select-pane -t ='
bind -n TripleClick1Pane select-pane -t = \; if-shell -F '#{mouse_any_flag}' 'send-keys -M' 'select-pane -t ='
bind -n M-MouseDown1Pane copy-mode -M
bind -n M-DoubleClick1Pane select-pane -t = \; copy-mode -H \; send -X select-word \; send -X copy-pipe-and-cancel
bind -n M-TripleClick1Pane select-pane -t = \; copy-mode -H \; send -X select-line \; send -X copy-pipe-and-cancel

bind p paste-buffer -p
bind e run-shell '"#{E:DOTFILES_DIR}/bin/tmux-copy" --buffer --notify'
# The agent's last reply (prefix+y or Shift+Copy): Claude's from its session
# file (draft untouched), Codex's and OpenCode's through their own copy keys.
bind y run-shell -b '"$DOTFILES_DIR/bin/tmux-last-reply" "#{pane_id}"'
bind -n C-S-IC run-shell -b '"$DOTFILES_DIR/bin/tmux-last-reply" "#{pane_id}"'   # Shift+physical Copy
unbind ']'
unbind P

# Compact keyboard context menus. All destructive actions confirm.
bind < display-menu -T "#[align=centre]Window #I:#W" -x W -y W \
    "New After" n { new-window -a -c "#{pane_current_path}" } \
    "Rename" r { command-prompt -p "rename window (blank = automatic):" { if-shell -F "#{==:%%,}" { setw automatic-rename on } { rename-window "%%" } } } \
    '' \
    "Swap Left" h { swap-window -t :-1 } \
    "Swap Right" l { swap-window -t :+1 } \
    "Toggle Sync" s { setw synchronize-panes ; display-message "synchronize-panes #{?synchronize-panes,on,off}" } \
    '' \
    "Kill Window" x { confirm-before -p "kill-window #I:#W and all panes? (y/n)" kill-window }

bind > display-menu -T "#[align=centre]Pane #P" -x P -y P \
    "Split Right" r { split-window -h -c "#{pane_current_path}" } \
    "Split Below" b { split-window -v -c "#{pane_current_path}" } \
    '' \
    "Join Left" j { if-shell -F "#{>:#{window_index},1}" { join-pane -h -s "#{pane_id}" -t :-1 } { display-message "Cannot join: no window to the left" } } \
    "Leave Right" l { if-shell -F "#{>:#{window_panes},1}" { break-pane -a } { display-message "Cannot leave: this is the only pane" } } \
    "Join Marked" J { if-shell -F "#{pane_marked_set}" { join-pane -h -t "#{pane_id}" } { display-message "No marked pane" } } \
    '' \
    "#{?pane_marked,Unmark,Mark}" m { select-pane -m } \
    "Swap Up" u { swap-pane -U } \
    "Swap Down" d { swap-pane -D } \
    "#{?window_zoomed_flag,Unzoom,Zoom}" z { resize-pane -Z } \
    '' \
    "Kill Pane" x { confirm-before -p "kill-pane #P? (y/n)" kill-pane }

# Utility
bind r source-file ~/.tmux.conf \; display-message "Tmux config reloaded!"
bind R resize-window -A \; setw window-size latest \; refresh-client
bind C-l if-shell -F '#{alternate_on}' \
    'send-keys C-l' \
    'send-keys -R C-l ; clear-history'
bind M-c run-shell \
    'for p in $(tmux list-panes -s -F "#{pane_id}"); do \
       tmux clear-history -t "$p"; done' \; \
    display "All pane histories cleared"

# Prune inherited defaults outside this configuration's workflow. Keep the
# keyboard context menus (< for windows, > for panes).
unbind 0                                     # Windows start at 1; Alt+0 targets 10
unbind '*'
unbind "'"
unbind M-1
unbind M-2
unbind M-3
unbind M-4
unbind M-5
unbind M-6
unbind M-7
unbind DC
unbind M-n
unbind M-p
unbind o
unbind ';'
unbind ','
unbind '.'
unbind '['
unbind '{'
unbind '}'
unbind M-Up
unbind M-Down
unbind M-Left
unbind M-Right
unbind C-o
unbind M-o
unbind '#'
unbind PPage

# ==============================================================================
# Mouse Support
# ==============================================================================

set -g mouse on

# Status-bar reordering is handled by prefix+i; remove the experimental drag
# bindings explicitly so a config reload clears them from a live server.
unbind -n M-MouseDown1Status
unbind -n M-MouseDrag1Status
unbind -n M-MouseDragEnd1Status

# A click on an inactive pane only focuses it: the press, and any drag and
# release after it, never reach the application, so focusing an agent pane
# cannot move its cursor or start a selection. @click-focus marks that gesture
# until its release. On the active pane, clicks go to a mouse-aware app.
# Ctrl+click is the app's too, not tmux's default swap with the marked pane.
bind -n MouseDown1Pane if-shell -F -t = '#{pane_active}' \
    { select-pane -t = ; set -pu -t = @click-focus ; send-keys -M } \
    { select-pane -t = ; set -p -t = @click-focus 1 }
bind -n MouseUp1Pane if-shell -F -t = '#{@click-focus}' { set -pu -t = @click-focus } { send-keys -M }
bind -n MouseDragEnd1Pane if-shell -F -t = '#{@click-focus}' { set -pu -t = @click-focus } { send-keys -M }
unbind -n C-MouseDown1Pane

# Ordinary drag focuses the pane (or is forwarded to a mouse-aware app) without
# entering copy mode. Alt+drag explicitly starts a tmux selection; Shift+drag
# remains WezTerm's native selection gesture.
bind -n MouseDrag1Pane if-shell -F -t = '#{@click-focus}' {} {
    if-shell -F -t = '#{mouse_any_flag}' { send-keys -M } { select-pane -t = }
}
bind -n M-MouseDrag1Pane copy-mode -M

# Wheel-up enters copy mode for scrollback when the application does not own it.
# Alternate-screen apps without mouse capture (Claude agent view, less) never
# reach tmux history, so the wheel pages them with PgUp/PgDn instead.
bind -n WheelUpPane if-shell -F -t = "#{||:#{mouse_any_flag},#{pane_in_mode}}" "send-keys -M" "if -Ft= '#{alternate_on}' 'send-keys -t = PPage' 'copy-mode -e'"
bind -n WheelDownPane if-shell -F -t = "#{||:#{mouse_any_flag},#{pane_in_mode}}" "send-keys -M" "if -Ft= '#{alternate_on}' 'send-keys -t = NPage'"

# ==============================================================================
# Visual Styling - Themes
# ==============================================================================

# Every style reads its colors from @theme_* options, which tmux expands per
# window: bin/theme-switcher sets them on global window options (the global
# theme) or on one window (`theme -w`). The status bar follows the current
# window. Until the switcher runs, or with the theme feature off, every color
# is the terminal default.
set -gw @theme off
set -gw @theme_bg default
set -gw @theme_fg default
set -gw @theme_secondary default
set -gw @theme_surface default
set -gw @theme_surface_2 default
set -gw @theme_border default
set -gw @theme_accent default
set -gw @theme_accent_2 default
set -gw @theme_tint_1 default
set -gw @theme_tint_2 default
set -gw @theme_tint_3 default

set -g window-style 'bg=#{@theme_bg},fg=#{@theme_fg}'
set -g window-active-style 'bg=#{@theme_bg},fg=#{@theme_fg}'
set -g pane-border-style 'fg=#{@theme_surface_2}'
set -g pane-active-border-style 'fg=#{@theme_accent}'
set -g mode-style 'bg=#{@theme_surface_2},fg=#{@theme_fg}'
set -g message-style 'bg=#{@theme_surface},fg=#{@theme_fg}'
set -g message-command-style 'bg=#{@theme_surface},fg=#{@theme_fg}'
set -g status-style 'bg=#{@theme_bg},fg=#{@theme_fg}'
set -g window-status-style 'bg=#{@theme_bg},fg=#{@theme_secondary}'
set -g window-status-current-style 'bg=#{@theme_surface},fg=#{@theme_fg},bold'
set -g window-status-activity-style 'bg=#{@theme_bg},fg=#{@theme_accent}'

# Use a direct run-shell: during config load, a command nested in `if-shell -b`
# inherits the starting client's $TMUX, so a server started from inside another
# tmux would theme that outer server instead of itself.
run-shell -b '"#{E:DOTFILES_DIR}/bin/theme-switcher" tmux-init >/dev/null 2>&1 || true'

# ==============================================================================
# Status Bar Configuration
# ==============================================================================

set -g status-position bottom
set -g status-justify left

set -g status-left '#[fg=#{@theme_bg},bg=#{@theme_accent},bold]  #S #[fg=#{@theme_accent},bg=#{@theme_bg},nobold] '
# Reverse video, like the SYNC warning below, while automatic clipboard export is off.
set -g status-right '#{?#{==:#{@clipboard-export},off},#[reverse] CLIP OFF #[noreverse] ,}#[fg=#{@theme_secondary}]#{user}@#h #[fg=#{@theme_border}]│ #[fg=#{@theme_accent}]%a %b %d #[fg=#{@theme_fg}]%H:%M '

set -g status-left-length 40
set -g status-right-length 80

# The agent badge (#{E:@cc_win_badge}) is not written here: the agent-badge
# plugin injects it into these formats when it wires itself, so the plugin works
# on machines without these dotfiles (see plugins/shared/README.md).
#
# synchronize-panes is a per-window option, so put its warning on each affected
# window rather than only in status-right for the currently selected window.
# Reverse video inherits every theme's palette while remaining hard to miss.
set -g window-status-format ' #I:#W#F#{?synchronize-panes, #[reverse]SYNC#[noreverse],} '
set -g window-status-current-format ' #I:#W#F#{?synchronize-panes, #[reverse]SYNC#[noreverse],} '
set -g window-status-separator ''

# ==============================================================================
# Activity and Monitoring
# ==============================================================================

setw -g monitor-activity off
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-bell off

# Swallow bells: Windows Terminal raises and focuses the window on a BEL, so
# every agent turn completion would steal focus. The window badge is the
# completion signal instead.
set -g bell-action none

# ==============================================================================
# Local Overrides
# ==============================================================================

# Per-machine settings, like ~/.shell.local. Last, so it overrides the above.
source-file -q ~/.tmux.local.conf
