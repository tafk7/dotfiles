# ==============================================================================
# Mouse Support
# ==============================================================================

set -g mouse on

# Status-bar reordering is handled by prefix+i; remove the experimental drag
# bindings explicitly so a config reload clears them from a live server.
unbind -n M-MouseDown1Status
unbind -n M-MouseDrag1Status
unbind -n M-MouseDragEnd1Status

# A click on an inactive pane only focuses it: the press, and any drag and
# release after it, never reach the application, so focusing an agent pane
# cannot move its cursor or start a selection. @click-focus marks that gesture
# until its release. On the active pane, clicks go to a mouse-aware app.
# Ctrl+click is the app's too, not tmux's default swap with the marked pane,
# and so is Ctrl+drag, which tmux 3.8 binds to opening a floating pane.
bind -N "Click an inactive pane: focus it only; the program sees neither the click nor a drag after it" -n MouseDown1Pane if-shell -F -t = '#{pane_active}' \
    { select-pane -t = ; set -pu -t = @click-focus ; send-keys -M } \
    { select-pane -t = ; set -p -t = @click-focus 1 }
bind -N "Click release: to the program, unless the click only focused the pane" -n MouseUp1Pane if-shell -F -t = '#{@click-focus}' { set -pu -t = @click-focus } { send-keys -M }
bind -N "Drag release: to the program, unless the click only focused the pane" -n MouseDragEnd1Pane if-shell -F -t = '#{@click-focus}' { set -pu -t = @click-focus } { send-keys -M }
unbind -n C-MouseDown1Pane
unbind -n C-MouseDrag1Pane

# Ordinary drag focuses the pane (or is forwarded to a mouse-aware app) without
# entering copy mode. Alt+drag explicitly starts a tmux selection; Shift+drag
# remains WezTerm's native selection gesture.
bind -N "Drag: to a mouse-aware program, else focus; never copy mode (Alt+drag is)" -n MouseDrag1Pane if-shell -F -t = '#{@click-focus}' {} {
    if-shell -F -t = '#{mouse_any_flag}' { send-keys -M } { select-pane -t = }
}
bind -N "Alt+drag: copy to the tmux buffer and clipboard on release" -n M-MouseDrag1Pane copy-mode -M

# Wheel-up enters copy mode for scrollback when the application does not own it.
# Alternate-screen apps without mouse capture (Claude agent view, less) never
# reach tmux history, so the wheel pages them with PgUp/PgDn instead.
bind -N "Wheel up: to a mouse-aware program, else copy mode (alternate-screen programs get PgUp)" -n WheelUpPane if-shell -F -t = "#{||:#{mouse_any_flag},#{pane_in_mode}}" "send-keys -M" "if -Ft= '#{alternate_on}' 'send-keys -t = PPage' 'copy-mode -e'"
bind -N "Wheel down: to a mouse-aware program (alternate-screen programs get PgDn)" -n WheelDownPane if-shell -F -t = "#{||:#{mouse_any_flag},#{pane_in_mode}}" "send-keys -M" "if -Ft= '#{alternate_on}' 'send-keys -t = NPage'"

# ==============================================================================
# Visual Styling - Themes
# ==============================================================================

# Every style reads its colors from @theme_* options, which tmux expands per
# window: bin/theme-switcher sets them on global window options (the global
# theme) or on one window (`theme -w`). The status bar follows the current
# window. Until the switcher runs, or with the theme feature off, every color
# is the terminal default.
set -gw @theme off
set -gw @theme_bg default
set -gw @theme_fg default
set -gw @theme_secondary default
set -gw @theme_surface default
set -gw @theme_surface_2 default
set -gw @theme_border default
set -gw @theme_accent default
set -gw @theme_accent_2 default
set -gw @theme_tint_1 default
set -gw @theme_tint_2 default
set -gw @theme_tint_3 default

set -g window-style 'bg=#{@theme_bg},fg=#{@theme_fg}'
set -g window-active-style 'bg=#{@theme_bg},fg=#{@theme_fg}'
set -g pane-border-style 'fg=#{@theme_surface_2}'
set -g pane-active-border-style 'fg=#{@theme_accent}'
set -g mode-style 'bg=#{@theme_surface_2},fg=#{@theme_fg}'
set -g message-style 'bg=#{@theme_surface},fg=#{@theme_fg}'
set -g message-command-style 'bg=#{@theme_surface},fg=#{@theme_fg}'
set -g status-style 'bg=#{@theme_bg},fg=#{@theme_fg}'
set -g window-status-style 'bg=#{@theme_bg},fg=#{@theme_secondary}'
set -g window-status-current-style 'bg=#{@theme_surface},fg=#{@theme_fg},bold'
set -g window-status-activity-style 'bg=#{@theme_bg},fg=#{@theme_accent}'

# tmux 3.8 paints the styles set nowhere above (copy-mode matches, display-panes,
# choose-tree, menus, popups) from a built-in light or dark palette. Keep them as
# they were: `terminal` maps that palette to the ANSI colors, which follow the
# terminal, and menus and popups, which had no colors, keep the terminal default.
# -q because tmux before 3.8 has no theme option.
set -sq theme terminal
set -g menu-style default
set -g menu-border-style default
set -g popup-style default
set -g popup-border-style default

# Use a direct run-shell: during config load, a command nested in `if-shell -b`
# inherits the starting client's $TMUX, so a server started from inside another
# tmux would theme that outer server instead of itself.
run-shell -b '"#{E:DOTFILES_DIR}/bin/theme-switcher" tmux-init >/dev/null 2>&1 || true'

# ==============================================================================
# Status Bar Configuration
# ==============================================================================

set -g status-position bottom
set -g status-justify left

set -g status-left '#[fg=#{@theme_bg},bg=#{@theme_accent},bold]  #S #[fg=#{@theme_accent},bg=#{@theme_bg},nobold] '
# Reverse video, like the SYNC warning below, while automatic clipboard export is off.
set -g status-right '#[fg=#{@theme_secondary}]#{user}@#h #[fg=#{@theme_border}]│ #[fg=#{@theme_accent}]%a %b %d #[fg=#{@theme_fg}]%H:%M '

set -g status-left-length 40
set -g status-right-length 80

# The agent badge (#{E:@cc_win_badge}) is not written here: the agent-badge
# plugin injects it into these formats when it wires itself, so the plugin works
# on machines without these dotfiles (see plugins/shared/README.md).
#
# synchronize-panes is a per-window option, so put its warning on each affected
# window rather than only in status-right for the currently selected window.
# Reverse video inherits every theme's palette while remaining hard to miss.
set -g window-status-format ' #I:#W#F#{?synchronize-panes, #[reverse]SYNC#[noreverse],} '
set -g window-status-current-format ' #I:#W#F#{?synchronize-panes, #[reverse]SYNC#[noreverse],} '
set -g window-status-separator ''

# ==============================================================================
# Activity and Monitoring
# ==============================================================================

setw -g monitor-activity off
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-bell off

# Swallow bells: a Windows terminal can raise and focus its window on a BEL, so
# every agent turn completion would steal focus. The window badge is the
# completion signal instead.
set -g bell-action none

# ==============================================================================
# Local Overrides
# ==============================================================================

# Per-machine settings, like ~/.shell.local. Last, so it overrides the above.
source-file -q ~/.tmux.local.conf
