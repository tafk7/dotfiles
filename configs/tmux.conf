# tmux configuration (dotfiles)

# ==============================================================================
# Core Settings
# ==============================================================================

# Capture the checkout location once in the server environment; helpers below
# expand it, so custom paths (including spaces) work. The bootstrap location is
# only a fallback for clients that did not inherit DOTFILES_DIR.
if-shell -F '#{==:#{E:DOTFILES_DIR},}' \
    'set-environment -g DOTFILES_DIR "$HOME/dev/dotfiles"' \
    'set-environment -g DOTFILES_DIR "$DOTFILES_DIR"'

# A server started from a dotfiles shell inherits its exported load guards, and
# every new pane would then skip the environment setup and keep the values the
# server started with. Drop them so each pane computes its own.
set-environment -gu _DOTFILES_BASE_ENV
set-environment -gu _DOTFILES_ENV_LOADED

set -g default-terminal "tmux-256color"

# The lines below append (-ga/-as), so unset both lists first to keep a reload
# idempotent. The scope flag must match the option (overrides is session-scoped,
# features server-scoped) or the unset silently does nothing.
set -gu terminal-overrides
set -su terminal-features

set -ga terminal-features ",xterm-256color:RGB"  # True color (modern; replaces Tc override)
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'  # Cursor shape support
set -ga terminal-overrides ',xterm*:khome=\EOH:kend=\EOF'  # Home/End (xterm sends \EOH/\EOF, tmux-256color expects \E[1~/\E[4~)
set -ga terminal-overrides ',xterm*:kDC5=\E[3;5~'        # Ctrl+Delete (forward delete-word)
# WezTerm sends these exact sequences for physical Alt+Paste/Copy.
set -ga terminal-overrides ',xterm*:kIC4=\E[2;4~:kIC7=\E[2;7~'

# The WezTerm config's revision, sent over SSH (configs/wezterm.lua): each
# attach takes the client's value, for dotfiles verify to compare.
set -ga update-environment LC_TAFK_WEZTERM

# Extended key support (tmux 3.2+) — enables Ctrl+Shift differentiation
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Synchronized output (DEC 2026). tmux's xterm* feature set omits it, so
# full-screen TUIs visibly repaint mid-frame. Terminals without it ignore the
# DECSET.
set -as terminal-features 'xterm*:sync'

# Performance and behavior
set -sg escape-time 10                       # Near-zero (0 causes escape artifacts in VS Code)
set -g repeat-time 500                       # Never leave a client stuck in the repeat key table
set -g history-limit 50000                   # Enough for Claude sessions (avoid 100K+ — reflow lag)
set -g display-time 4000                     # Status messages display longer
set -g status-interval 15                    # Lower refresh (reduces overhead during heavy TUI output)
set -g status-keys emacs                     # Shell-like prompts; Escape cancels
set -g focus-events on                       # Focus events for vim autoread
# OSC 52 is driven by bin/tmux-copy (see "Clipboard" below), not by tmux. `off`
# rather than `external`, which still emits an unbounded escape sequence on
# every copy and stalls the terminal on large selections.
set -g set-clipboard off
set -gu @clipboard-export                    # Retired toggle: export is always on
set -gu @clipboard-osc52                     # Retired test flag
set -g @clipboard-limit 65536                # bytes of selection sent to the clipboard
# allow-passthrough is tmux 3.3+; 3.2a (Ubuntu 22.04) errors on it at load.
# Version gate: if 3.3 sorts first against the running version, we're >= 3.3.
if-shell -b '[ "$(printf "%s\n3.3" "$(tmux -V | cut -d" " -f2 | tr -cd "0-9.")" | sort -V | head -1)" = "3.3" ]' \
    'set -g allow-passthrough on'            # OSC 52, DEC 2026 sync output
set -g window-size latest                    # Follow the most recently active client
setw -g aggressive-resize off                # Keep inactive windows in sync with session geometry

# Window and pane behavior
set -g base-index 1                          # Start windows at 1
setw -g pane-base-index 1                    # Start panes at 1
set -g renumber-windows on                   # Renumber windows when one is closed
setw -g automatic-rename on                  # Rename window to current program
# Name windows by directory, not command: most windows run the same agent CLI.
# Renaming a window manually turns this off for it.
setw -g automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on                         # Set terminal title
set -g set-titles-string '#S: #W'           # Title format

# ==============================================================================
# Key Bindings — Prefix
# ==============================================================================

unbind C-b
set -g prefix C-a
bind -N "Send Ctrl+A to the program (the prefix twice)" C-a send-prefix

# ==============================================================================
# No-Prefix Bindings (left-hand optimized, instant)
#
# Layout mirrors left half of split keyboard:
#   Alt+ESDF         = pane navigate (arrow diamond); S/F cross windows
#   Alt+Shift+S/F    = first / last window
#   Alt+1–0          = window jump (0 selects window 10)
#   Alt+Shift+W/T     = window/pane operations
#
# Core no-prefix actions retain prefix alternatives for laptop use.
# ==============================================================================

# Pane navigation — Alt+ESDF and Alt+arrows (no prefix) + C-a mirror.
# Vertical moves stop at the layout's edge. Horizontal moves cross to the
# neighboring window at the outer edge, landing on its facing pane, and wrap
# around past the first and last window. Alt+Shift+S/F jump to the first and
# last window.
# Unbind the shifted variants so a reload clears them from a live server.
unbind -n M-E
unbind -n M-D
bind -N "First window" -n M-S select-window -t '{start}'
bind -N "Last window" -n M-F select-window -t '{end}'
bind -N "Focus the pane above; stops at the edge" -n M-e if-shell -F '#{pane_at_top}' {} { select-pane -U }
bind -N "Focus the pane below; stops at the edge" -n M-d if-shell -F '#{pane_at_bottom}' {} { select-pane -D }
bind -N "Focus the pane left; at the edge, the previous window's facing pane (wraps around)" -n M-s if-shell -F '#{pane_at_left}' {
    if-shell -F '#{==:#{session_windows},1}' {} { previous-window ; select-pane -t '{right}' }
} { select-pane -L }
bind -N "Focus the pane right; at the edge, the next window's facing pane (wraps around)" -n M-f if-shell -F '#{pane_at_right}' {
    if-shell -F '#{==:#{session_windows},1}' {} { next-window ; select-pane -t '{left}' }
} { select-pane -R }
bind -N "Focus the pane above, as Alt+E (laptop)" -n M-Up if-shell -F '#{pane_at_top}' {} { select-pane -U }
bind -N "Focus the pane below, as Alt+D (laptop)" -n M-Down if-shell -F '#{pane_at_bottom}' {} { select-pane -D }
bind -N "Focus the pane left, as Alt+S (laptop)" -n M-Left if-shell -F '#{pane_at_left}' {
    if-shell -F '#{==:#{session_windows},1}' {} { previous-window ; select-pane -t '{right}' }
} { select-pane -L }
bind -N "Focus the pane right, as Alt+F (laptop)" -n M-Right if-shell -F '#{pane_at_right}' {
    if-shell -F '#{==:#{session_windows},1}' {} { next-window ; select-pane -t '{left}' }
} { select-pane -R }

# Window jump — Alt+number
bind -N "Jump to window 1" -n M-1 select-window -t 1
bind -N "Jump to window 2" -n M-2 select-window -t 2
bind -N "Jump to window 3" -n M-3 select-window -t 3
bind -N "Jump to window 4" -n M-4 select-window -t 4
bind -N "Jump to window 5" -n M-5 select-window -t 5
bind -N "Jump to window 6" -n M-6 select-window -t 6
bind -N "Jump to window 7" -n M-7 select-window -t 7
bind -N "Jump to window 8" -n M-8 select-window -t 8
bind -N "Jump to window 9" -n M-9 select-window -t 9
bind -N "Jump to window 10" -n M-0 select-window -t 10

# Alt+W/R used to step windows; Alt+S/F cross windows now, so they go back to
# the applications (Alt+R is Codex's raw-output toggle).
unbind -n M-w
unbind -n M-r

# Window/pane operations — Alt+Shift+key (no prefix) + C-a mirror
bind -N "Window picker (tree view)" -n M-W choose-tree -Zw                  # Window picker
bind -N "New window after this one, in this pane's directory" -n M-T new-window -a -c "#{pane_current_path}"   # New window after current
unbind -n M-G                                # Synchronization is prefix/menu only
unbind -n M-Q                                # Window stepping/picker replace last-window
unbind -n M-A                                # Zoom is prefix+z only
unbind -n M-X                                # Kill actions require the prefix

# ==============================================================================
# Prefix Bindings
# ==============================================================================

# Pane navigation — C-a + arrow (prefix mirror for laptop use)
bind -N "Focus the pane above (laptop)" Up select-pane -U
bind -N "Focus the pane left (laptop)" Left select-pane -L
bind -N "Focus the pane below (laptop)" Down select-pane -D
bind -N "Focus the pane right (laptop)" Right select-pane -R

# Application passthrough for Meta keys claimed by no-prefix pane navigation.
# Example: C-a then Alt+f sends the shell/fzf forward-word command.
bind -N "Send Alt+E to the program (Alt+E itself moves focus)" M-e send-keys M-e
bind -N "Send Alt+S to the program (Alt+S itself moves focus)" M-s send-keys M-s
bind -N "Send Alt+D to the program (Alt+D itself moves focus)" M-d send-keys M-d
bind -N "Send Alt+F to the program, the shell's forward-word (Alt+F itself moves focus)" M-f send-keys M-f

# Pane resize — C-a + Shift+Arrow (repeatable)
bind -N "Resize the pane 5 lines up (repeatable)" -r S-Up resize-pane -U 5
bind -N "Resize the pane 5 columns left (repeatable)" -r S-Left resize-pane -L 5
bind -N "Resize the pane 5 lines down (repeatable)" -r S-Down resize-pane -D 5
bind -N "Resize the pane 5 columns right (repeatable)" -r S-Right resize-pane -R 5

# Window/pane operations — C-a + key
unbind a
bind -N "Zoom the pane (toggle)" z resize-pane -Z                        # Zoom pane toggle
bind -N "New window after this one, in this pane's directory" t new-window -a -c "#{pane_current_path}"  # New window after current
bind -N "Window picker (tree view)" w choose-tree -Zw                       # Window picker
bind -N "Type into every pane of the window at once (toggle)" g setw synchronize-panes \; display 'synchronize-panes #{?synchronize-panes,on,off}'

# Splits (preserve current path)
unbind '"'
unbind %
unbind \\
unbind b
bind -N "Split top and bottom (horizontal divider)" - split-window -v -c "#{pane_current_path}"
bind -N "Split side by side (vertical divider)" = split-window -h -c "#{pane_current_path}"

# Window/session operations
# A blank name restores directory-based automatic naming.
# Prompts that take text use %1, not %%: tmux 3.8 escapes %% for single quotes
# even inside a { } block, which is not parsed again, so a ' typed at the prompt
# arrives escaped. %1 is the same response, inserted as typed, in every version.
unbind c
bind -N "Rename the window; blank restores automatic naming" n command-prompt -p "rename window (blank = automatic):" { if-shell -F "#{==:%1,}" { setw automatic-rename on } { rename-window "%1" } }
unbind M-,                                   # Blank rename restores auto-naming
bind -N "Move the window to an index; -1 or past the end moves it last" i command-prompt -p "insert window at index:" {
    if-shell -F "#{||:#{==:%%,-1},#{>:%%,#{session_windows}}}" {
        if-shell -F "#{==:#{window_index},#{session_windows}}" {
            display-message "window already at end"
        } {
            move-window -a -t ":#{session_windows}"
        }
    } {
        if-shell -F "#{<:%%,1}" {
            display-message "invalid window index: %%"
        } {
            if-shell -F "#{==:%%,#{window_index}}" {
                display-message "window already at index %%"
            } {
                if-shell -F "#{<:%%,#{window_index}}" {
                    move-window -b -t ":%%"
                } {
                    move-window -a -t ":%%"
                }
            }
        }
    }
}
bind -N "New session" C new-session
unbind &
bind -N "Kill the pane (asks first)" x confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind -N "Kill the window and all its panes (asks first)" X confirm-before -p "kill-window #I:#W and all panes? (y/n)" kill-window
bind -N "Session chooser (tree view)" s choose-tree -Zs                       # Session chooser

# Pane operations — spatial join/leave pair
bind -N "Join this pane into the window to the left, on its right side" j if-shell -F '#{>:#{window_index},1}' \
    'join-pane -h -s "#{pane_id}" -t :-1' \
    'display-message "Cannot join: no window to the left"'
bind -N "Leave: this pane becomes a new window right after this one" l if-shell -F '#{>:#{window_panes},1}' \
    'break-pane -a' \
    'display-message "Cannot leave: this is the only pane"'
unbind '!'
bind -N "Show pane numbers for 3 seconds; type one to jump there" q display-panes -d 3000                 # Show pane numbers
bind -N "Next pane layout" Space next-layout
bind -N "Previous pane layout" C-Space previous-layout

# Copy mode and clipboard
bind -N "Copy mode (Alt + the Copy key)" -n C-M-IC copy-mode                     # Alt+physical Copy key
bind -N "Paste the tmux buffer with bracketed-paste markers (Alt + the Paste key)" -n M-S-IC paste-buffer -p               # Alt+physical Paste key
# Copy-mode on what the pane shows now, without moving: in an agent, the live
# screen, including the prompt being typed. Review (below) is prefix+f.
bind -N "Copy mode on what the pane shows now (in an agent: the live screen and prompt); again leaves" v if-shell -F '#{pane_in_mode}' 'send -X cancel' 'copy-mode'

# Compose: Alt+V opens a Neovim pane under this one for writing a prompt, or
# moves focus between the two; Ctrl+S there pastes and submits (bin/tmux-compose).
# In Claude, Codex, and OpenCode, Alt+V and the agent's editor key (Ctrl+G,
# Ctrl+G, Ctrl+X E) bring the prompt box along, and quitting the pane puts it
# back. Alt+Shift+V, the big version, opens the prompt in nvim in the program's
# place: Claude, Codex and OpenCode run it as their editor, and anything else
# gets its own editor key (pi Ctrl+G, a shell Ctrl+X Ctrl+E). It replaces
# Ctrl+Shift+G, unbound on a live server.
bind -N "Compose: a Neovim pane under this one for writing a prompt, or switch focus between them" -n M-v run-shell -b '"$DOTFILES_DIR/bin/tmux-compose" toggle "#{pane_id}"'
bind -N "Edit the prompt in Neovim in the program's place (without compose-editor: pi Ctrl+G, a shell Ctrl+X Ctrl+E)" -n M-V if-shell -F '#{pane_in_mode}' {} {
    run-shell -b '"$DOTFILES_DIR/bin/tmux-compose" fullscreen "#{pane_id}"'
}
unbind -n C-S-G

# Agent keys (issues/intent-keys.md). Shift+Tab is each agent's own cycle;
# Alt+Shift+J, K and L are a dial from most to least access, jumping straight
# to yolo (bypass permissions), auto and edits only (accept edits) through
# bin/tmux-agent-mode, and go on to anything else as they are. Ctrl+Shift+Tab goes on to the program too.
%hidden AGENT='#{&&:#{m/r:^(claude|codex|opencode|pi)$,#{pane_current_command}},#{==:#{pane_in_mode},0}}'
bind -N "Yolo: Claude bypass permissions, Codex Full Access (from an empty prompt), OpenCode auto accept" -n M-J if-shell -F "$AGENT" { run-shell -b '"$DOTFILES_DIR/bin/tmux-agent-mode" yolo "#{pane_id}"' } { send-keys M-J }
bind -N "Auto permission mode: Claude auto mode, Codex Approve for me" -n M-K if-shell -F "$AGENT" { run-shell -b '"$DOTFILES_DIR/bin/tmux-agent-mode" auto "#{pane_id}"' } { send-keys M-K }
bind -N "Edits only: Claude accept edits, Codex Ask for approval, OpenCode prompt" -n M-L if-shell -F "$AGENT" { run-shell -b '"$DOTFILES_DIR/bin/tmux-agent-mode" edits "#{pane_id}"' } { send-keys M-L }
unbind -n BTab
unbind -n C-BTab
unbind -n C-S-Tab
# Messages (issues/intent-keys.md). Enter sends, and steers a turn that is
# running in every agent. Alt+Enter queues one for after the turn with each
# agent's own key: Claude and OpenCode Ctrl+X Enter, Codex Tab, pi Alt+Enter;
# in a compose pane it sends the draft (Ctrl+S there), which queues the same
# way. Alt+Shift+Enter takes queued messages back into the prompt: Claude Up
# (at an empty prompt, all of them), Codex Shift+Left (the last), pi Alt+Up
# (all), and OpenCode opens its queue (Ctrl+X Q), where Ctrl+U takes one back.
# Shift+Enter is a new line in Codex too, which reads it as Enter: Ctrl+J
# there. Anything else gets the keys as they are. Alt+Enter replaces Shift+F8.
bind -N "Queue a message for after the turn (Enter steers a running one); in a compose pane, send the draft" -n M-Enter if-shell -F '#{pane_in_mode}' {} {
    if-shell -F '#{m/r:^(claude|opencode)$,#{pane_current_command}}' { send-keys C-x Enter } {
        if-shell -F '#{==:#{pane_current_command},codex}' { send-keys Tab } {
            if-shell -F '#{||:#{==:#{pane_current_command},pi},#{==:#{@compose_target},}}' { send-keys M-Enter } {
                send-keys C-s
            }
        }
    }
}
bind -N "Take queued messages back into the prompt (OpenCode: open its queue; Ctrl+U there)" -n M-S-Enter if-shell -F '#{pane_in_mode}' {} {
    if-shell -F '#{==:#{pane_current_command},claude}' { send-keys Up } {
        if-shell -F '#{==:#{pane_current_command},codex}' { send-keys S-Left } {
            if-shell -F '#{==:#{pane_current_command},opencode}' { send-keys C-x q } {
                if-shell -F '#{==:#{pane_current_command},pi}' { send-keys M-Up } { send-keys M-S-Enter }
            }
        }
    }
}
bind -N "New line in Codex, which reads Shift+Enter as Enter (sends Ctrl+J)" -n S-Enter if-shell -F '#{&&:#{==:#{pane_current_command},codex},#{==:#{pane_in_mode},0}}' \
    'send-keys C-j' 'send-keys S-Enter'
unbind -n S-F8
# Alt+Z: back a turn, as Ctrl+Z undoes typing. Claude and Codex take Esc twice
# (Claude's rewind picker; Codex steps back from an empty prompt), a moment
# apart so they read two presses; OpenCode Ctrl+X U undoes the turn and puts
# the message back; pi opens its session tree on Alt+Z itself
# (configs/ai/pi/keybindings.json). In a running turn the first Esc stops it.
bind -N "Back a turn: Claude rewind, Codex step back, OpenCode undo, pi session tree" -n M-z if-shell -F '#{pane_in_mode}' {} {
    if-shell -F '#{m/r:^(claude|codex)$,#{pane_current_command}}' {
        send-keys Escape ; run-shell 'sleep 0.15' ; send-keys Escape
    } {
        if-shell -F '#{==:#{pane_current_command},opencode}' { send-keys C-x u } { send-keys M-z }
    }
}
# Alt+M picks a model: Claude, OpenCode and pi bind it themselves; Codex has no
# key, so tmux runs /model in it from an empty prompt (bin/tmux-codex-slash).
bind -N "Pick a model: in Codex, /model from an empty prompt (the other agents bind Alt+M)" -n M-m if-shell -F '#{&&:#{==:#{pane_current_command},codex},#{==:#{pane_in_mode},0}}' {
    run-shell -b '"$DOTFILES_DIR/bin/tmux-codex-slash" --say model "#{pane_id}"'
} { send-keys M-m }
# Break (Pause; WezTerm sends Shift+F9): stop whatever runs. Esc interrupts an
# agent's turn, and anything else gets Ctrl+C: a plain Ctrl+C would exit
# OpenCode and clear pi's prompt.
bind -N "Break (Pause): stop whatever runs; Esc to an agent, Ctrl+C to anything else" -n S-F9 if-shell -F '#{m/r:^(claude|codex|opencode|pi)$,#{pane_current_command}}' \
    'send-keys Escape' 'send-keys C-c'
# Ctrl+Z undoes typing everywhere, as in Windows, and never suspends: the shells
# turn the terminal's suspend key off and bind Ctrl+Z to undo (entry/bash.sh,
# entry/zsh.sh), Neovim, OpenCode and pi bind it to undo, Claude's undo is
# Ctrl+_ (chat:undo), and Codex, which has no undo and would suspend, gets
# nothing. prefix+Ctrl+Z suspends the program in the foreground: Claude and
# Codex suspend themselves on the key; anything else is sent SIGTSTP, as the
# terminal's suspend key would have. fg resumes it.
bind -N "Undo typing everywhere, never suspend (Claude Ctrl+_; Codex has no undo)" -n C-z if-shell -F '#{pane_in_mode}' { send-keys C-z } {
    if-shell -F '#{==:#{pane_current_command},claude}' { send-keys C-_ } {
        if-shell -F '#{==:#{pane_current_command},codex}' { display-message 'Codex has no undo' } { send-keys C-z }
    }
}
bind -N "Suspend the program in the foreground (fg resumes it)" C-z if-shell -F '#{m/r:^(claude|codex)$,#{pane_current_command}}' { send-keys C-z } {
    run-shell -b '"$DOTFILES_DIR/bin/tmux-suspend" "#{pane_pid}"'
}

# Browse: PgUp and Ctrl+Home scroll a shell's history in copy-mode, which exits
# at the bottom. Fullscreen and mouse-aware apps (agents, less, inline fzf)
# scroll themselves, so they get the keys, as with the wheel below. Inside
# copy-mode its own table takes them.
bind -N "Shell pane: copy mode a page up (exits at the bottom); apps scroll themselves" -n PPage if-shell -F '#{||:#{alternate_on},#{mouse_any_flag}}' { send-keys PPage } { copy-mode -eu }
bind -N "Shell pane: copy mode at the top of history; apps get the key" -n C-Home if-shell -F '#{||:#{alternate_on},#{mouse_any_flag}}' { send-keys C-Home } {
    copy-mode -e ; send-keys -X history-top
}
# Shift+PgUp/PgDn scroll a few lines (@scroll-lines, default 3) in every pane:
# shells, copy-mode and review, and Claude, Codex, and OpenCode, which get
# mouse-wheel events (bin/tmux-scroll). From a compose pane, its agent scrolls.
# Not in the background, so that presses in a row apply in order.
bind -N "Scroll a few lines up anywhere: shells, review, Claude, Codex, OpenCode, a compose pane's agent" -n S-PPage run-shell '"$DOTFILES_DIR/bin/tmux-scroll" up "#{pane_id}"'
bind -N "Scroll a few lines down anywhere: shells, review, Claude, Codex, OpenCode, a compose pane's agent" -n S-NPage run-shell '"$DOTFILES_DIR/bin/tmux-scroll" down "#{pane_id}"'
bind -N "Review: scroll a few lines up" -T copy-mode-vi S-PPage run-shell '"$DOTFILES_DIR/bin/tmux-scroll" up "#{pane_id}"'
bind -N "Review: scroll a few lines down" -T copy-mode-vi S-NPage run-shell '"$DOTFILES_DIR/bin/tmux-scroll" down "#{pane_id}"'

# Plain Copy key. WezTerm forwards it only when it has no selection of its own.
# Copy mode copies its selection (bound below with y); Codex copies its own
# (Ctrl+Space or mouse) with the key as it is; otherwise hand the key to Claude
# and swallow it elsewhere, so no escape sequence reaches a shell. Claude's
# keybindings have no name for Insert, so it gets Ctrl+Shift+C, its
# selection:copy (which WezTerm keeps for itself) -- but only while Claude has
# asked for extended keys. Otherwise tmux would send that as a plain Ctrl+C,
# which interrupts. pane_key_mode is tmux 3.5+; older servers swallow the key.
bind -N "Copy key: Claude and Codex copy their own selection (WezTerm forwards the key when it has none)" -n C-IC if-shell -F '#{==:#{pane_current_command},codex}' 'send-keys C-IC' {
    if-shell -F '#{&&:#{==:#{pane_current_command},claude},#{==:#{pane_key_mode},Ext 2}}' 'send-keys C-S-c'
}

# Ctrl+C in Claude sends Esc. Claude's own Ctrl+C at an idle prompt stops every
# background agent at once, without asking, and Claude won't let the key be
# rebound; Esc interrupts the running turn and leaves background agents alone.
# prefix+Ctrl+C sends a real Ctrl+C (clear the input, exit, stop the agents);
# Claude's Ctrl+X Ctrl+K, pressed twice, also stops them.
bind -N "In Claude, Esc: interrupt the turn and spare background agents; elsewhere Ctrl+C" -n C-c if-shell -F '#{&&:#{==:#{pane_current_command},claude},#{==:#{pane_in_mode},0}}' \
    'send-keys Escape' 'send-keys C-c'
bind -N "A real Ctrl+C, in Claude too (clear the input, exit, stop the agents)" C-c send-keys C-c

# Word and line deletes in Claude match the shell, Codex and nvim: Ctrl deletes
# a word, Alt to the start or end of the line. Claude hard-codes these keys
# (Ctrl+Backspace and Ctrl+Delete delete a character, Alt+Backspace a word), so
# tmux sends the keys Claude has for each instead. Ctrl+Backspace arrives as
# C-h, or as C-BSpace from a terminal reporting extended keys. Other panes, and
# Claude panes in copy-mode, get the key unchanged, except that C-BSpace goes
# on as C-h: tmux would otherwise send it as nothing (3.4) or as its name (3.7).
# OpenCode gets C-w: it turns on extended keys (mode 1), where tmux sends C-h
# as the plain 0x08 byte, which OpenCode reads as Backspace (OpenCode 2.2.2).
bind -N "Ctrl+Backspace: delete the word before the cursor, in Claude and OpenCode too" -n C-h if-shell -F '#{&&:#{==:#{pane_current_command},claude},#{==:#{pane_in_mode},0}}' \
    'send-keys M-BSpace' {
        if-shell -F '#{&&:#{==:#{pane_current_command},opencode},#{==:#{pane_in_mode},0}}' \
            'send-keys C-w' 'send-keys C-h'
    }
bind -N "Ctrl+Backspace: delete the word before the cursor, in Claude and OpenCode too" -n C-BSpace if-shell -F '#{&&:#{==:#{pane_current_command},claude},#{==:#{pane_in_mode},0}}' \
    'send-keys M-BSpace' {
        if-shell -F '#{&&:#{==:#{pane_current_command},opencode},#{==:#{pane_in_mode},0}}' \
            'send-keys C-w' 'send-keys C-h'
    }
bind -N "Ctrl+Delete: delete the word after the cursor, in Claude too" -n C-DC if-shell -F '#{&&:#{==:#{pane_current_command},claude},#{==:#{pane_in_mode},0}}' \
    'send-keys M-d' 'send-keys C-DC'
bind -N "Alt+Backspace: delete to the start of the line, in Claude too" -n M-BSpace if-shell -F '#{&&:#{==:#{pane_current_command},claude},#{==:#{pane_in_mode},0}}' \
    'send-keys C-u' 'send-keys M-BSpace'
# The same key, Esc DEL, as tmux 3.6 reads it: Meta and the DEL byte, which no
# key name means there (it reads "M-C-?" as Ctrl, Meta, and ?).
bind -N "Alt+Backspace: delete to the start of the line, in Claude too" -n "M-\177" if-shell -F '#{&&:#{==:#{pane_current_command},claude},#{==:#{pane_in_mode},0}}' \
    'send-keys C-u' 'send-keys "M-\177"'
bind -N "Alt+Delete: delete to the end of the line, in Claude too" -n M-DC if-shell -F '#{&&:#{==:#{pane_current_command},claude},#{==:#{pane_in_mode},0}}' \
    'send-keys C-k' 'send-keys M-DC'

# Review: ScrollLock (WezTerm sends Shift+F5) or prefix+f. A
# frozen view of the pane in copy-mode, with the keys below in every pane: a
# shell's history in place; an agent's conversation, as the agent exports it, in
# a review pane zoomed over the agent, which keeps running (bin/tmux-review).
# Shift+ScrollLock (Shift+F7) or prefix+/ reviews and searches upward at once;
# prefix+o opens the conversation or history read-only in nvim. Leaving
# copy-mode removes a review pane; the hook runs in the pane that changed mode.
bind -N "Review the pane in copy mode: a shell's history in place; an agent's conversation in a review pane zoomed over it" f run-shell -b '"$DOTFILES_DIR/bin/tmux-review" toggle "#{pane_id}" "#{client_name}"'
bind -N "ScrollLock: review the pane, as prefix+f" -n S-F5 run-shell -b '"$DOTFILES_DIR/bin/tmux-review" toggle "#{pane_id}" "#{client_name}"'
bind -N "Shift+ScrollLock: review the pane and search upward" -n S-F7 run-shell -b '"$DOTFILES_DIR/bin/tmux-review" search "#{pane_id}" "#{client_name}"'
bind -N "Review the pane and search upward" / run-shell -b '"$DOTFILES_DIR/bin/tmux-review" search "#{pane_id}" "#{client_name}"'
bind -N "Open the agent's conversation or the pane's history read-only in an nvim popup with review's keys (q closes)" o run-shell -b '"$DOTFILES_DIR/bin/tmux-review" edit "#{pane_id}" "#{client_name}"'
bind -N "ScrollLock in review: leave it" -T copy-mode-vi S-F5 send -X cancel
set-hook -g pane-mode-changed {
    if-shell -F '#{&&:#{@review-pane},#{==:#{pane_in_mode},0}}' {
        run-shell -b '"$DOTFILES_DIR/bin/tmux-review" close "#{pane_id}"'
    }
}

setw -g mode-keys vi
unbind -T copy-mode-vi Space
unbind -T copy-mode-vi v
unbind -T copy-mode-vi V
unbind -T copy-mode-vi C-v
unbind -T copy-mode-vi c
bind -N "Clear the selection, else leave copy mode" -T copy-mode-vi Escape if-shell -F '#{||:#{selection_active},#{selection_present}}' \
    'send -X clear-selection ; set -pu @select-toggle' \
    'send -X cancel'
bind -N "Leave copy mode" -T copy-mode-vi q send -X cancel

# Review keys (issues/scrollback-copy-compose.md §3.3), the ESDF diamond as
# arrows. Ctrl moves by word (S/F) or prompt (E/D). Home/End go to the ends of
# the line, Ctrl+Home/End to the ends of history. Prompt jumps follow OSC 133
# marks, which the shell prints and a review pane puts before each prompt of a
# conversation.
# Shift is the selection switch, as in a Windows text box: a move with Shift
# starts a selection or extends it, a move without Shift drops it. h instead
# starts a selection that plain moves extend, until h or Esc ends it
# (@select-toggle marks one). Paging, scrolling and search keep a selection.
# A selection counts from begin-selection: tmux 3.5+ reports selection_present
# only once it covers a character, and selection_active until then.
# configs/nvim/lua/dotfiles/review.lua gives the nvim popup the same keys.
# Displaced vi defaults: e, f/F/t/T, h, o, v, D (copied to end of line and
# exited), Ctrl+E/D/F. j/k/g/G still work.
%hidden SELECTING='#{||:#{selection_active},#{selection_present}}'
%hidden DROP="#{&&:$SELECTING,#{!=:#{@select-toggle},1}}"
bind -N "Review: start a selection that plain moves extend; h or Esc ends it" -T copy-mode-vi h if-shell -F "$SELECTING" {
    send -X clear-selection ; set -pu @select-toggle
} { send -X begin-selection ; set -p @select-toggle 1 }
bind -N "Review: move up; drops a selection Shift started" -T copy-mode-vi e         if -F "$DROP" { send -X clear-selection } \; send -X cursor-up
bind -N "Review: move down; drops a selection Shift started" -T copy-mode-vi d         if -F "$DROP" { send -X clear-selection } \; send -X cursor-down
bind -N "Review: move left; drops a selection Shift started" -T copy-mode-vi s         if -F "$DROP" { send -X clear-selection } \; send -X cursor-left
bind -N "Review: move right; drops a selection Shift started" -T copy-mode-vi f         if -F "$DROP" { send -X clear-selection } \; send -X cursor-right
bind -N "Review: move up" -T copy-mode-vi Up        if -F "$DROP" { send -X clear-selection } \; send -X cursor-up
bind -N "Review: move down" -T copy-mode-vi Down      if -F "$DROP" { send -X clear-selection } \; send -X cursor-down
bind -N "Review: move left" -T copy-mode-vi Left      if -F "$DROP" { send -X clear-selection } \; send -X cursor-left
bind -N "Review: move right" -T copy-mode-vi Right     if -F "$DROP" { send -X clear-selection } \; send -X cursor-right
bind -N "Review: word left" -T copy-mode-vi C-s       if -F "$DROP" { send -X clear-selection } \; send -X previous-word
bind -N "Review: word right" -T copy-mode-vi C-f       if -F "$DROP" { send -X clear-selection } \; send -X next-word-end
bind -N "Review: word left" -T copy-mode-vi C-Left    if -F "$DROP" { send -X clear-selection } \; send -X previous-word
bind -N "Review: word right" -T copy-mode-vi C-Right   if -F "$DROP" { send -X clear-selection } \; send -X next-word-end
bind -N "Review: previous prompt (shell and review-pane OSC 133 marks)" -T copy-mode-vi C-e       if -F "$DROP" { send -X clear-selection } \; send -X previous-prompt
bind -N "Review: next prompt (shell and review-pane OSC 133 marks)" -T copy-mode-vi C-d       if -F "$DROP" { send -X clear-selection } \; send -X next-prompt
bind -N "Review: previous prompt" -T copy-mode-vi C-Up      if -F "$DROP" { send -X clear-selection } \; send -X previous-prompt
bind -N "Review: next prompt" -T copy-mode-vi C-Down    if -F "$DROP" { send -X clear-selection } \; send -X next-prompt
bind -N "Review: start of the line" -T copy-mode-vi Home      if -F "$DROP" { send -X clear-selection } \; send -X start-of-line
bind -N "Review: end of the line" -T copy-mode-vi End       if -F "$DROP" { send -X clear-selection } \; send -X end-of-line
bind -N "Review: top of history" -T copy-mode-vi C-Home    if -F "$DROP" { send -X clear-selection } \; send -X history-top
bind -N "Review: bottom of history" -T copy-mode-vi C-End     if -F "$DROP" { send -X clear-selection } \; send -X history-bottom
bind -N "Review: select upward, as Shift does in a Windows text box" -T copy-mode-vi E         if -F "$SELECTING" {} { send -X begin-selection ; set -pu @select-toggle } \; send -X cursor-up
bind -N "Review: select downward" -T copy-mode-vi D         if -F "$SELECTING" {} { send -X begin-selection ; set -pu @select-toggle } \; send -X cursor-down
bind -N "Review: select left" -T copy-mode-vi S         if -F "$SELECTING" {} { send -X begin-selection ; set -pu @select-toggle } \; send -X cursor-left
bind -N "Review: select right" -T copy-mode-vi F         if -F "$SELECTING" {} { send -X begin-selection ; set -pu @select-toggle } \; send -X cursor-right
bind -N "Review: select upward" -T copy-mode-vi S-Up      if -F "$SELECTING" {} { send -X begin-selection ; set -pu @select-toggle } \; send -X cursor-up
bind -N "Review: select downward" -T copy-mode-vi S-Down    if -F "$SELECTING" {} { send -X begin-selection ; set -pu @select-toggle } \; send -X cursor-down
bind -N "Review: select left" -T copy-mode-vi S-Left    if -F "$SELECTING" {} { send -X begin-selection ; set -pu @select-toggle } \; send -X cursor-left
bind -N "Review: select right" -T copy-mode-vi S-Right   if -F "$SELECTING" {} { send -X begin-selection ; set -pu @select-toggle } \; send -X cursor-right
bind -N "Review: select a word left" -T copy-mode-vi C-S-S     if -F "$SELECTING" {} { send -X begin-selection ; set -pu @select-toggle } \; send -X previous-word
bind -N "Review: select a word right" -T copy-mode-vi C-S-F     if -F "$SELECTING" {} { send -X begin-selection ; set -pu @select-toggle } \; send -X next-word-end
bind -N "Review: select a word left" -T copy-mode-vi C-S-Left  if -F "$SELECTING" {} { send -X begin-selection ; set -pu @select-toggle } \; send -X previous-word
bind -N "Review: select a word right" -T copy-mode-vi C-S-Right if -F "$SELECTING" {} { send -X begin-selection ; set -pu @select-toggle } \; send -X next-word-end
bind -N "Review: select to the previous prompt" -T copy-mode-vi C-S-E     if -F "$SELECTING" {} { send -X begin-selection ; set -pu @select-toggle } \; send -X previous-prompt
bind -N "Review: select to the next prompt" -T copy-mode-vi C-S-D     if -F "$SELECTING" {} { send -X begin-selection ; set -pu @select-toggle } \; send -X next-prompt
bind -N "Review: select to the previous prompt" -T copy-mode-vi C-S-Up    if -F "$SELECTING" {} { send -X begin-selection ; set -pu @select-toggle } \; send -X previous-prompt
bind -N "Review: select to the next prompt" -T copy-mode-vi C-S-Down  if -F "$SELECTING" {} { send -X begin-selection ; set -pu @select-toggle } \; send -X next-prompt
bind -N "Review: select to the start of the line" -T copy-mode-vi S-Home    if -F "$SELECTING" {} { send -X begin-selection ; set -pu @select-toggle } \; send -X start-of-line
bind -N "Review: select to the end of the line" -T copy-mode-vi S-End     if -F "$SELECTING" {} { send -X begin-selection ; set -pu @select-toggle } \; send -X end-of-line
bind -N "Review: select to the top of history" -T copy-mode-vi C-S-Home  if -F "$SELECTING" {} { send -X begin-selection ; set -pu @select-toggle } \; send -X history-top
bind -N "Review: select to the bottom of history" -T copy-mode-vi C-S-End   if -F "$SELECTING" {} { send -X begin-selection ; set -pu @select-toggle } \; send -X history-bottom
# Review starts at the bottom, so / searches upward; n/N repeat in its direction.
bind -N "Review: search up as you type; n and N repeat" -T copy-mode-vi / command-prompt -i -T search -p '(search up)' { send -X search-backward-incremental '%1' }
bind -N "Review: search up as you type (Shift+ScrollLock)" -T copy-mode-vi S-F7 command-prompt -i -T search -p '(search up)' { send -X search-backward-incremental '%1' }
bind -N "Review: search down as you type" -T copy-mode-vi ? command-prompt -i -T search -p '(search down)' { send -X search-forward-incremental '%1' }
bind -N "Review: open what review shows read-only in an nvim popup at this line, with review's keys (q closes)" -T copy-mode-vi o run-shell -b '"$DOTFILES_DIR/bin/tmux-review" open "#{pane_id}" "#{client_name}"'
unbind -T copy-mode-vi t
unbind -T copy-mode-vi T

# Numeric repeat prompts can survive awkward reconnect/input sequences and trap
# the client at a `(repeat)` prompt. Counts are not part of this copy workflow.
unbind -T copy-mode-vi 1
unbind -T copy-mode-vi 2
unbind -T copy-mode-vi 3
unbind -T copy-mode-vi 4
unbind -T copy-mode-vi 5
unbind -T copy-mode-vi 6
unbind -T copy-mode-vi 7
unbind -T copy-mode-vi 8
unbind -T copy-mode-vi 9

# Clipboard. Every copy sets the tmux buffer, so prefix+p pastes at any size,
# and bin/tmux-copy sends it on to the attached clients' clipboard as OSC 52,
# up to @clipboard-limit. Over Windows -> ssh -> Linux, OSC 52 is the only path
# to the client clipboard, and the size gate keeps it from freezing the
# terminal. Copy-mode copies reach it as copy-command; buffers loaded from
# outside (nvim yanks, shell cuts, Claude) through the after-load-buffer hook,
# which skips buffers loaded under a name (-b). #{buffer_name} there is the
# newest automatic buffer, not the loaded one; #{hook_flag_b} is the name.
set -s copy-command '"$DOTFILES_DIR/bin/tmux-copy"'
set-hook -g after-load-buffer {
    run-shell -b '"$DOTFILES_DIR/bin/tmux-copy" --hook "#{hook_flag_b}"'
}
# The export toggle (prefix+E, Pause) is gone; unbind it on a live server.
unbind E
unbind -n S-F6

bind -N "Copy the selection to the tmux buffer and clipboard" -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -N "Copy key: copy the selection to the tmux buffer and clipboard" -T copy-mode-vi C-IC send -X copy-pipe-and-cancel
bind -N "Alt+Copy: copy the selection to the tmux buffer and clipboard" -T copy-mode-vi C-M-IC send -X copy-pipe-and-cancel
unbind -T copy-mode-vi Enter
unbind -T copy-mode-vi C-j

# Tmux mouse selection is entirely Alt-gated. Ordinary clicks only focus or
# reach the application, except that in copy-mode a click puts the cursor where
# it lands (any copy command a mouse binding sends moves it there first), ready
# for Shift+E/S/D/F; Alt double/triple-click yank a word/line immediately.
bind -N "Click in copy mode: put the cursor there, ready for Shift+E/S/D/F" -T copy-mode-vi MouseDown1Pane select-pane -t = \; send -X -t = clear-selection \; set -pu -t = @select-toggle
bind -N "Drag in copy mode: focus only (Alt+drag selects)" -T copy-mode-vi MouseDrag1Pane select-pane -t =
bind -N "Drag release in copy mode: focus only" -T copy-mode-vi MouseDragEnd1Pane select-pane -t =
bind -N "Double-click in copy mode: focus only (Alt+double-click copies the word)" -T copy-mode-vi DoubleClick1Pane select-pane
bind -N "Triple-click in copy mode: focus only (Alt+triple-click copies the line)" -T copy-mode-vi TripleClick1Pane select-pane
bind -N "Alt+click in copy mode: focus the pane" -T copy-mode-vi M-MouseDown1Pane select-pane
bind -N "Alt+drag in copy mode: select" -T copy-mode-vi M-MouseDrag1Pane select-pane \; send -X begin-selection
bind -N "Alt+drag release in copy mode: copy to the tmux buffer and clipboard" -T copy-mode-vi M-MouseDragEnd1Pane send -X copy-pipe-and-cancel
bind -N "Alt+double-click in copy mode: copy the word to the tmux buffer and clipboard" -T copy-mode-vi M-DoubleClick1Pane select-pane \; send -X select-word \; send -X copy-pipe-and-cancel
bind -N "Alt+triple-click in copy mode: copy the line to the tmux buffer and clipboard" -T copy-mode-vi M-TripleClick1Pane select-pane \; send -X select-line \; send -X copy-pipe-and-cancel

bind -N "Double-click: to a mouse-aware program, else focus only" -n DoubleClick1Pane select-pane -t = \; if-shell -F '#{mouse_any_flag}' 'send-keys -M' 'select-pane -t ='
bind -N "Triple-click: to a mouse-aware program, else focus only" -n TripleClick1Pane select-pane -t = \; if-shell -F '#{mouse_any_flag}' 'send-keys -M' 'select-pane -t ='
bind -N "Alt+click: copy mode at the mouse position" -n M-MouseDown1Pane copy-mode -M
bind -N "Alt+double-click: copy the clicked word to the tmux buffer and clipboard" -n M-DoubleClick1Pane select-pane -t = \; copy-mode -H \; send -X select-word \; send -X copy-pipe-and-cancel
bind -N "Alt+triple-click: copy the clicked line to the tmux buffer and clipboard" -n M-TripleClick1Pane select-pane -t = \; copy-mode -H \; send -X select-line \; send -X copy-pipe-and-cancel

bind -N "Paste the tmux buffer, with bracketed-paste markers when the program takes them" p paste-buffer -p
bind -N "Export the newest tmux buffer to the client (Windows) clipboard again" e run-shell '"#{E:DOTFILES_DIR}/bin/tmux-copy" --buffer --notify'
# The agent's last reply (prefix+y or Shift+Copy): Claude's from its session
# file (draft untouched), Codex's and OpenCode's through their own copy keys.
bind -N "Copy the agent's last reply (Claude: from its session file, draft untouched; Codex, OpenCode: their copy keys)" y run-shell -b '"$DOTFILES_DIR/bin/tmux-last-reply" "#{pane_id}"'
bind -N "Shift+Copy: copy the agent's last reply, as prefix+y" -n C-S-IC run-shell -b '"$DOTFILES_DIR/bin/tmux-last-reply" "#{pane_id}"'   # Shift+physical Copy
unbind ']'
unbind P

# Compact keyboard context menus. All destructive actions confirm.
bind -N "Window menu: new, rename, swap, sync, kill" < display-menu -T "#[align=centre]Window #I:#W" -x W -y W \
    "New After" n { new-window -a -c "#{pane_current_path}" } \
    "Rename" r { command-prompt -p "rename window (blank = automatic):" { if-shell -F "#{==:%1,}" { setw automatic-rename on } { rename-window "%1" } } } \
    '' \
    "Swap Left" h { swap-window -t :-1 } \
    "Swap Right" l { swap-window -t :+1 } \
    "Toggle Sync" s { setw synchronize-panes ; display-message "synchronize-panes #{?synchronize-panes,on,off}" } \
    '' \
    "Kill Window" x { confirm-before -p "kill-window #I:#W and all panes? (y/n)" kill-window }

bind -N "Pane menu: split, join, leave, mark, swap, zoom, kill" > display-menu -T "#[align=centre]Pane #P" -x P -y P \
    "Split Right" r { split-window -h -c "#{pane_current_path}" } \
    "Split Below" b { split-window -v -c "#{pane_current_path}" } \
    '' \
    "Join Left" j { if-shell -F "#{>:#{window_index},1}" { join-pane -h -s "#{pane_id}" -t :-1 } { display-message "Cannot join: no window to the left" } } \
    "Leave Right" l { if-shell -F "#{>:#{window_panes},1}" { break-pane -a } { display-message "Cannot leave: this is the only pane" } } \
    "Join Marked" J { if-shell -F "#{pane_marked_set}" { join-pane -h -t "#{pane_id}" } { display-message "No marked pane" } } \
    '' \
    "#{?pane_marked,Unmark,Mark}" m { select-pane -m } \
    "Swap Up" u { swap-pane -U } \
    "Swap Down" d { swap-pane -D } \
    "#{?window_zoomed_flag,Unzoom,Zoom}" z { resize-pane -Z } \
    '' \
    "Kill Pane" x { confirm-before -p "kill-pane #P? (y/n)" kill-pane }

# Utility
bind -N "Reload the tmux config" r source-file ~/.tmux.conf \; display-message "Tmux config reloaded!"
bind -N "Fit the window to this client and resume automatic sizing" R resize-window -A \; setw window-size latest \; refresh-client
bind -N "Clear the screen and scrollback history" C-l if-shell -F '#{alternate_on}' \
    'send-keys C-l' \
    'send-keys -R C-l ; clear-history'
bind -N "Clear the history of every pane in the session" M-c run-shell \
    'for p in $(tmux list-panes -s -F "#{pane_id}"); do \
       tmux clear-history -t "$p"; done' \; \
    display "All pane histories cleared"

# Key lookup (bin/keys): what a key, alias or command does, in a popup scoped to
# this pane's program. Alt+? (Alt+Shift+/, among tmux's bigger moves) or
# prefix+?, which replaces tmux's own list-keys: keys lists every note here and
# what the program in the pane binds as well. Ctrl+G there types a name into
# this pane. keys opens the popup itself, as display-popup expands no formats.
bind -N "Key lookup for this pane's program" -n M-? run-shell -b '"$DOTFILES_DIR/bin/keys" --popup "#{pane_id}" "#{client_name}"'
bind -N "Key lookup for this pane's program" ? run-shell -b '"$DOTFILES_DIR/bin/keys" --popup "#{pane_id}" "#{client_name}"'

