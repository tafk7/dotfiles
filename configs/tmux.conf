# Modern Tmux Configuration - Power User Setup
# Part of dotfiles - optimized for neovim/shell integration

# ==============================================================================
# Core Settings
# ==============================================================================

# Better terminal support
set -g default-terminal "tmux-256color"
set -ga terminal-features ",xterm-256color:RGB"  # True color (modern; replaces Tc override)
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'  # Cursor shape support
set -ga terminal-overrides ',xterm*:khome=\EOH:kend=\EOF'  # Home/End (xterm sends \EOH/\EOF, tmux-256color expects \E[1~/\E[4~)
set -ga terminal-overrides ',xterm*:kDC5=\E[3;5~'        # Ctrl+Delete (forward delete-word)

# Extended key support (tmux 3.2+) — enables Ctrl+Shift differentiation
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Performance and behavior
set -sg escape-time 10                       # Near-zero (0 causes escape artifacts in VS Code)
set -g history-limit 50000                   # Enough for Claude sessions (avoid 100K+ — reflow lag)
set -g display-time 4000                     # Status messages display longer
set -g status-interval 15                    # Lower refresh (reduces overhead during heavy TUI output)
set -g focus-events on                       # Focus events for vim autoread
set -g set-clipboard on                      # OSC 52 clipboard integration
# allow-passthrough is tmux 3.3+; 3.2a (Ubuntu 22.04) errors on it at load.
# Version gate: if 3.3 sorts first against the running version, we're >= 3.3.
if-shell -b '[ "$(printf "%s\n3.3" "$(tmux -V | cut -d" " -f2 | tr -cd "0-9.")" | sort -V | head -1)" = "3.3" ]' \
    'set -g allow-passthrough on'            # OSC 52, DEC 2026 sync output
set -g aggressive-resize on                  # Resize to smallest client actually viewing

# Window and pane behavior
set -g base-index 1                          # Start windows at 1
setw -g pane-base-index 1                    # Start panes at 1
set -g renumber-windows on                   # Renumber windows when one is closed
setw -g automatic-rename on                  # Rename window to current program
# Auto-name from directory basename, not pane_current_command: every window here
# runs `claude`, so the default format renders them all identically. Only applies
# to windows that were never manually renamed (naming a window turns this off).
setw -g automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on                         # Set terminal title
set -g set-titles-string '#S: #W'           # Title format

# ==============================================================================
# Key Bindings — Prefix
# ==============================================================================

unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ==============================================================================
# No-Prefix Bindings (left-hand optimized, instant)
#
# Layout mirrors left half of split keyboard:
#   Alt+Shift+ESDF   = pane navigate (arrow diamond)
#   Alt+1–5          = window jump
#   Alt+Shift+Q/W/A/T/X/G = window/pane operations
#
# Every no-prefix binding also has a C-a prefix mirror for laptops.
# ==============================================================================

# Pane navigation — Alt+Shift+ESDF (no prefix) + C-a mirror
bind -n M-E select-pane -U
bind -n M-S select-pane -L
bind -n M-D select-pane -D
bind -n M-F select-pane -R

# Window jump — Alt+number
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-0 select-window -t 10

# Window step — Alt+w/r (no prefix, repeatable). W and R flank E on the top row,
# so they read as left/right shoulders around the ESDF diamond. Lowercase: no Shift.
bind -n -r M-w previous-window
bind -n -r M-r next-window

# Window/pane operations — Alt+Shift+key (no prefix) + C-a mirror
bind -n M-Q last-window                      # Toggle last window
bind -n M-W choose-tree -Zw                  # Window picker
bind -n M-A resize-pane -Z                   # Zoom pane toggle
bind -n M-T new-window -c "#{pane_current_path}"   # New window
bind -n M-X confirm-before -p "kill-pane? (y/n)" kill-pane  # Kill pane (with confirm)
bind -n M-G setw synchronize-panes \; display 'synchronize-panes #{?synchronize-panes,on,off}'

# ==============================================================================
# Prefix Bindings
# ==============================================================================

# Pane navigation — C-a + arrow (prefix mirror for laptop use)
bind Up select-pane -U
bind Left select-pane -L
bind Down select-pane -D
bind Right select-pane -R

# Pane resize — C-a + Shift+Arrow (repeatable)
bind -r S-Up resize-pane -U 5
bind -r S-Left resize-pane -L 5
bind -r S-Down resize-pane -D 5
bind -r S-Right resize-pane -R 5

# Window/pane operations — C-a + key (mirrors no-prefix)
bind a resize-pane -Z                        # Zoom pane toggle
bind t new-window -c "#{pane_current_path}"  # New window
bind w choose-tree -Zw                       # Window picker
bind g setw synchronize-panes \; display 'synchronize-panes #{?synchronize-panes,on,off}'

# Splits (preserve current path)
unbind '"'
unbind %
bind - split-window -v -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind b split-window -h -c "#{pane_current_path}"  # Left-hand alternative for h-split

# Window/session operations
bind c command-prompt "rename-window '%%'"    # Rename window (turns automatic-rename off)
bind M-, setw automatic-rename on \; display 'automatic-rename on'  # Revert to auto-naming
bind C new-session
bind x kill-window                           # Kill window (Alt+Shift+X kills pane)
bind e switch-client -n                      # Next session
bind E switch-client -p                      # Previous session
bind s choose-tree -Zs                       # Session chooser

# Pane operations
bind j command-prompt -p "join pane from:" "join-pane -s '%%'"
bind q display-panes -d 3000                 # Show pane numbers
bind Space next-layout
bind C-Space previous-layout

# Copy mode and clipboard
bind v copy-mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle

# Cross-platform clipboard: prefer WSL (clip.exe), then Wayland (wl-copy),
# then X11 (xclip). OSC 52 (set-clipboard on, set elsewhere) handles SSH.
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "if command -v clip.exe >/dev/null 2>&1; then clip.exe; elif command -v wl-copy >/dev/null 2>&1; then wl-copy; elif command -v xclip >/dev/null 2>&1; then xclip -in -selection clipboard; else cat >/dev/null; fi"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "if command -v clip.exe >/dev/null 2>&1; then clip.exe; elif command -v wl-copy >/dev/null 2>&1; then wl-copy; elif command -v xclip >/dev/null 2>&1; then xclip -in -selection clipboard; else cat >/dev/null; fi"
bind p paste-buffer
bind P run "if [ -x '/mnt/c/Program Files/PowerShell/7/pwsh.exe' ]; then '/mnt/c/Program Files/PowerShell/7/pwsh.exe' -NoProfile -Command Get-Clipboard | tr -d '\\r'; elif [ -x /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe ]; then /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoProfile -Command Get-Clipboard | tr -d '\\r'; elif command -v wl-paste >/dev/null 2>&1; then wl-paste; elif command -v xclip >/dev/null 2>&1; then xclip -o -sel clipboard; else printf ''; fi | tmux load-buffer - ; tmux paste-buffer"

# Utility
bind r source-file ~/.tmux.conf \; display-message "Tmux config reloaded!"
bind C-l if-shell -F '#{alternate_on}' \
    'send-keys C-l' \
    'send-keys -R C-l ; clear-history'
bind M-c run-shell \
    'for p in $(tmux list-panes -s -F "#{pane_id}"); do \
       tmux clear-history -t "$p"; done' \; \
    display "All pane histories cleared"

# ==============================================================================
# Mouse Support
# ==============================================================================

set -g mouse on

# Mouse drag to copy
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"

# ==============================================================================
# Visual Styling - Dynamic Theme Loading
# ==============================================================================

# Fallback status content, set BEFORE the theme is sourced. Every theme defines
# status-left/right, so this only shows when no theme is installed. Ordering is
# the whole mechanism: last write wins, so the theme overrides these.
# (Previously these sat after the theme behind an `if-shell [ -z "$status_left" ]`
# test. $status_left is a shell variable that is never set, so the test always
# passed and the defaults silently clobbered every theme's status bar.)
set -g status-left '#[bold]  #S │ '
set -g status-right '#{user}@#h │ %a %b %d %H:%M '

# Source theme configuration (created by theme-switcher --init during setup)
if-shell "test -f ~/.tmux/theme.conf" \
    "source-file ~/.tmux/theme.conf"

# ==============================================================================
# Status Bar Configuration
# ==============================================================================

set -g status-position bottom
set -g status-justify left

# Status bar length
set -g status-left-length 40
set -g status-right-length 80

# Status content comes from the theme file (see "Fallback status content" above,
# which runs before the theme is sourced so the theme can override it).

# Window status format
#
# @cc_win_state is written by ~/.local/share/tmux/agent-status.sh (wired from Claude
# Code and Codex hooks) and holds the highest-severity agent
# state among that window's panes:
#   ACTIONABLE (agent-neutral -- same response whichever harness):
#     needs   ◆ yellow  waiting on a permission decision
#     done    ● green   finished a turn, hasn't been looked at
#   NEARLY-ACTIONABLE:
#     waiting ✻ in #10b981 (teal-green) — finished, but background subagents
#             are still running. CLAUDE ONLY: Codex's SubagentStop does not
#             reliably fire, so a Codex pane could pin here indefinitely.
#   AMBIENT (agent-specific -- tells you what is running where):
#     active  ✻ orange (Claude) / ✾ blue (Codex)
#     idle    same glyph, dimmed
#     busy    ◐ in the agent's colour (compacting). Compaction stashes the
#             prior state and restores it afterwards -- it is an interlude, not
#             a state change.
#
# Glyph choice is constrained by rendering: window-status-current-style is bold,
# and thin or hollow glyphs get filled in or smeared at terminal cell size. ⬡ and
# ◉ were both tried and discarded for this. Prefer solid silhouettes.
#
# Agent colours are literal hex, not theme colours -- a brand colour shouldn't
# shift when the theme does. COLORTERM=truecolor here.
#
set -g window-status-format ' #{E:@cc_win_badge}#I:#W#F '
set -g window-status-current-format ' #{E:@cc_win_badge}#I:#W#F '
set -g window-status-separator ''

# done -> idle when you actually look at the window. Keeps a marker that a
# finished Claude lives here, but stops it reading as "needs attention".
#
# -a appends rather than replacing, so we don't clobber any other global handler
# (the failure mode in several published Claude/tmux plugins). But -a also means
# a plain reload appends a *second* copy, and `source-file ~/.tmux.conf` is bound
# to prefix+r — so handlers would multiply on every reload. -u clears the array
# first, making this idempotent. Safe here specifically because neither hook had
# a handler before this config (verified with show-hooks on a clean server); if
# that ever changes, this would need to drop only its own index.
# NB: set-hook -R does NOT reset — it runs the hook immediately.
set-hook -gu pane-focus-in
set-hook -ga pane-focus-in 'run-shell -b "~/.local/share/tmux/agent-status.sh seen #{pane_id}"'

# Recompute when a pane dies so a killed Claude doesn't leave a stale badge.
# Must pass #{pane_id}: a bare `tmux set -wu @cc_win_state` has no target and so
# clears whichever window is *currently active*, not the one that lost a pane —
# which desynced window state from pane state.
# `reap` re-derives the window badge from the surviving panes rather than
# blanking it, so killing a shell next to a live Claude keeps the Claude badge.
set-hook -gu pane-exited
set-hook -ga pane-exited 'run-shell -b "~/.local/share/tmux/agent-status.sh reap #{pane_id}"'

# Quitting Claude leaves the pane alive as a shell, so pane-exited never fires
# and the badge would keep a phantom glyph until some *other* pane in that window
# happened to fire a hook. pane-focus-in forces a recompute whenever you look at
# a window, which is exactly when a stale badge would be noticed. The reap action
# prunes any pane no longer running claude.
set-hook -ga pane-focus-in 'run-shell -b "~/.local/share/tmux/agent-status.sh reap #{pane_id}"'

# Reconcile against Claude Code's own session files (~/.claude/sessions/<pid>.json),
# which carry an authoritative busy/idle status and the owning pane id. Hooks
# drive the rich states, but a hook that never fires -- an errored turn, a killed
# process, an Esc interrupt -- strands the badge on `working` forever. This is the
# ground truth that unsticks it. Demotion-only, and Claude-only: Codex ships no
# equivalent file.
set-hook -ga pane-focus-in 'run-shell -b "~/.local/share/tmux/agent-reconcile.sh"'

# ==============================================================================
# Activity and Monitoring
# ==============================================================================

# Disable activity monitoring (less noise)
setw -g monitor-activity off
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-bell off

# Swallow bells instead of forwarding them to the terminal. Default is
# `bell-action any`, which passes a real BEL through; Windows Terminal responds
# by raising/focusing the window, so every Claude turn completion yanked focus
# to whichever window finished. The window badge is the completion signal now.
set -g bell-action none

