# Modern Tmux Configuration - Power User Setup
# Part of dotfiles - optimized for neovim/shell integration

# ==============================================================================
# Core Settings
# ==============================================================================

# Capture the checkout location once in the tmux server environment. Every
# helper below expands this value, so custom paths (including spaces) work. The
# documented bootstrap location is only a fallback for clients that did not
# inherit DOTFILES_DIR.
if-shell -F '#{==:#{E:DOTFILES_DIR},}' \
    'set-environment -g DOTFILES_DIR "$HOME/dev/dotfiles"' \
    'set-environment -g DOTFILES_DIR "$DOTFILES_DIR"'

# Better terminal support
set -g default-terminal "tmux-256color"
set -ga terminal-features ",xterm-256color:RGB"  # True color (modern; replaces Tc override)
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'  # Cursor shape support
set -ga terminal-overrides ',xterm*:khome=\EOH:kend=\EOF'  # Home/End (xterm sends \EOH/\EOF, tmux-256color expects \E[1~/\E[4~)
set -ga terminal-overrides ',xterm*:kDC5=\E[3;5~'        # Ctrl+Delete (forward delete-word)
# Windows Terminal emits these exact sequences for physical Alt+Paste/Copy.
set -ga terminal-overrides ',xterm*:kIC4=\E[2;4~:kIC7=\E[2;7~'

# Extended key support (tmux 3.2+) — enables Ctrl+Shift differentiation
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Performance and behavior
set -sg escape-time 10                       # Near-zero (0 causes escape artifacts in VS Code)
set -g repeat-time 500                       # Never leave a client stuck in the repeat key table
set -g history-limit 50000                   # Enough for Claude sessions (avoid 100K+ — reflow lag)
set -g display-time 4000                     # Status messages display longer
set -g status-interval 15                    # Lower refresh (reduces overhead during heavy TUI output)
set -g status-keys emacs                     # Shell-like prompts; Escape cancels
set -g focus-events on                       # Focus events for vim autoread
# OSC 52 clipboard is driven by bin/tmux-copy, not by tmux itself — see the copy
# bindings below. `off` (not `external`: that still sets the clipboard) stops
# tmux emitting an unbounded escape sequence on every copy, which stalled the
# terminal for seconds on large selections.
set -g set-clipboard off
set -g @clipboard-osc52 off                  # Test flag: set to on to export copies to clients
set -g @clipboard-limit 65536                # bytes of selection sent to the clipboard
# allow-passthrough is tmux 3.3+; 3.2a (Ubuntu 22.04) errors on it at load.
# Version gate: if 3.3 sorts first against the running version, we're >= 3.3.
if-shell -b '[ "$(printf "%s\n3.3" "$(tmux -V | cut -d" " -f2 | tr -cd "0-9.")" | sort -V | head -1)" = "3.3" ]' \
    'set -g allow-passthrough on'            # OSC 52, DEC 2026 sync output
set -g window-size latest                    # Follow the most recently active client
setw -g aggressive-resize off                # Keep inactive windows in sync with session geometry

# Window and pane behavior
set -g base-index 1                          # Start windows at 1
setw -g pane-base-index 1                    # Start panes at 1
set -g renumber-windows on                   # Renumber windows when one is closed
setw -g automatic-rename on                  # Rename window to current program
# Auto-name from directory basename, not pane_current_command: every window here
# runs `claude`, so the default format renders them all identically. Only applies
# to windows that were never manually renamed (naming a window turns this off).
setw -g automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on                         # Set terminal title
set -g set-titles-string '#S: #W'           # Title format

# ==============================================================================
# Key Bindings — Prefix
# ==============================================================================

unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ==============================================================================
# No-Prefix Bindings (left-hand optimized, instant)
#
# Layout mirrors left half of split keyboard:
#   Alt+ESDF         = pane navigate (arrow diamond)
#   Alt+1–0          = window jump (0 selects window 10)
#   Alt+Shift+W/T     = window/pane operations
#
# Core no-prefix actions retain prefix alternatives for laptop use.
# ==============================================================================

# Pane navigation — Alt+ESDF (no prefix) + C-a mirror
# Unbind the old shifted variants explicitly so a config reload removes them.
unbind -n M-E
unbind -n M-S
unbind -n M-D
unbind -n M-F
bind -n M-e select-pane -U
bind -n M-s select-pane -L
bind -n M-d select-pane -D
bind -n M-f select-pane -R

# Laptop fallback: vertical arrows stay pane-local; horizontal arrows cross to
# the neighboring window only after reaching the pane layout's outer edge.
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
bind -n M-Left if-shell -F '#{pane_at_left}' \
    'previous-window' \
    'select-pane -L'
bind -n M-Right if-shell -F '#{pane_at_right}' \
    'next-window' \
    'select-pane -R'

# Window jump — Alt+number
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-0 select-window -t 10

# Window step — Alt+w/r (no prefix). W and R flank E on the top row,
# so they read as left/right shoulders around the ESDF diamond. Lowercase: no Shift.
bind -n M-w previous-window
bind -n M-r next-window

# Window/pane operations — Alt+Shift+key (no prefix) + C-a mirror
bind -n M-W choose-tree -Zw                  # Window picker
bind -n M-T new-window -a -c "#{pane_current_path}"   # New window after current
unbind -n M-G                                # Synchronization is prefix/menu only
unbind -n M-Q                                # Window stepping/picker replace last-window
unbind -n M-A                                # Zoom is prefix+z only
unbind -n M-X                                # Kill actions require the prefix

# ==============================================================================
# Prefix Bindings
# ==============================================================================

# Pane navigation — C-a + arrow (prefix mirror for laptop use)
bind Up select-pane -U
bind Left select-pane -L
bind Down select-pane -D
bind Right select-pane -R

# Application passthrough for Meta keys claimed by no-prefix pane navigation.
# Example: C-a then Alt+f sends the shell/fzf forward-word command.
bind M-e send-keys M-e
bind M-s send-keys M-s
bind M-d send-keys M-d
bind M-f send-keys M-f

# Pane resize — C-a + Shift+Arrow (repeatable)
bind -r S-Up resize-pane -U 5
bind -r S-Left resize-pane -L 5
bind -r S-Down resize-pane -D 5
bind -r S-Right resize-pane -R 5

# Window/pane operations — C-a + key
unbind a
bind z resize-pane -Z                        # Zoom pane toggle
bind t new-window -a -c "#{pane_current_path}"  # New window after current
bind w choose-tree -Zw                       # Window picker
bind g setw synchronize-panes \; display 'synchronize-panes #{?synchronize-panes,on,off}'

# Splits (preserve current path)
unbind '"'
unbind %
unbind \\
unbind b
bind - split-window -v -c "#{pane_current_path}"
bind = split-window -h -c "#{pane_current_path}"

# Window/session operations
# A blank name restores directory-based automatic naming.
unbind c
bind n command-prompt -p "rename window (blank = automatic):" { if-shell -F "#{==:%%,}" { setw automatic-rename on } { rename-window "%%" } }
unbind M-,                                   # Blank rename restores auto-naming
bind i command-prompt -p "insert window at index:" {
    if-shell -F "#{||:#{==:%%,-1},#{>:%%,#{session_windows}}}" {
        if-shell -F "#{==:#{window_index},#{session_windows}}" {
            display-message "window already at end"
        } {
            move-window -a -t ":#{session_windows}"
        }
    } {
        if-shell -F "#{<:%%,1}" {
            display-message "invalid window index: %%"
        } {
            if-shell -F "#{==:%%,#{window_index}}" {
                display-message "window already at index %%"
            } {
                if-shell -F "#{<:%%,#{window_index}}" {
                    move-window -b -t ":%%"
                } {
                    move-window -a -t ":%%"
                }
            }
        }
    }
}
bind C new-session
unbind &
bind x confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind X confirm-before -p "kill-window #I:#W and all panes? (y/n)" kill-window
unbind e
unbind E
bind s choose-tree -Zs                       # Session chooser

# Pane operations — spatial join/leave pair
bind j if-shell -F '#{>:#{window_index},1}' \
    'join-pane -h -s "#{pane_id}" -t :-1' \
    'display-message "Cannot join: no window to the left"'
bind l if-shell -F '#{>:#{window_panes},1}' \
    'break-pane -a' \
    'display-message "Cannot leave: this is the only pane"'
unbind '!'
bind q display-panes -d 3000                 # Show pane numbers
bind Space next-layout
bind C-Space previous-layout

# Copy mode and clipboard
bind v if-shell -F '#{pane_in_mode}' \
    'send -X cancel' \
    'copy-mode'                              # Toggle transcript view without moving
bind -n C-M-IC copy-mode                     # Alt+physical Copy key
bind -n M-S-IC paste-buffer -p               # Alt+physical Paste key
setw -g mode-keys vi
unbind -T copy-mode-vi Space
unbind -T copy-mode-vi V
unbind -T copy-mode-vi C-v
unbind -T copy-mode-vi c
bind -T copy-mode-vi v if-shell -F '#{selection_present}' \
    'send -X clear-selection' \
    'send -X begin-selection'
bind -T copy-mode-vi Escape if-shell -F '#{selection_present}' \
    'send -X clear-selection' \
    'send -X cancel'
bind -T copy-mode-vi q send -X cancel

# Numeric repeat prompts can survive awkward reconnect/input sequences and trap
# the client at a `(repeat)` prompt. Counts are not part of this copy workflow.
unbind -T copy-mode-vi 1
unbind -T copy-mode-vi 2
unbind -T copy-mode-vi 3
unbind -T copy-mode-vi 4
unbind -T copy-mode-vi 5
unbind -T copy-mode-vi 6
unbind -T copy-mode-vi 7
unbind -T copy-mode-vi 8
unbind -T copy-mode-vi 9

# Clipboard: when @clipboard-osc52 is on, bin/tmux-copy emits OSC 52 straight
# to the attached client's tty, but only for selections under @clipboard-limit.
# With it off, selections stay entirely in tmux and skip the pipe/base64 work.
# The old chain here tried
# clip.exe -> wl-copy -> xclip; on a Windows->ssh->Linux box none of them work
# (no clip.exe, no wl-copy, and xclip has no $DISPLAY to reach), so OSC 52 is
# the only real path and the size gate is what keeps it from freezing the
# terminal. The tmux buffer is set regardless, so prefix+p pastes at any size.
bind -T copy-mode-vi y if-shell -F '#{==:#{@clipboard-osc52},on}' \
    'send -X copy-pipe-and-cancel "#{E:DOTFILES_DIR}/bin/tmux-copy"' \
    'send -X copy-selection-and-cancel'
unbind -T copy-mode-vi C-IC
bind -T copy-mode-vi C-M-IC if-shell -F '#{==:#{@clipboard-osc52},on}' \
    'send -X copy-pipe-and-cancel "#{E:DOTFILES_DIR}/bin/tmux-copy"' \
    'send -X copy-selection-and-cancel'
unbind -T copy-mode-vi Enter
unbind -T copy-mode-vi C-j

# Tmux mouse selection is entirely Alt-gated. Ordinary clicks only focus or
# reach the application; Alt double/triple-click yank a word/line immediately.
bind -T copy-mode-vi MouseDown1Pane select-pane -t =
bind -T copy-mode-vi MouseDrag1Pane select-pane -t =
bind -T copy-mode-vi MouseDragEnd1Pane select-pane -t =
bind -T copy-mode-vi DoubleClick1Pane select-pane
bind -T copy-mode-vi TripleClick1Pane select-pane
bind -T copy-mode-vi M-MouseDown1Pane select-pane
bind -T copy-mode-vi M-MouseDrag1Pane select-pane \; send -X begin-selection
bind -T copy-mode-vi M-MouseDragEnd1Pane send -X copy-selection-and-cancel
bind -T copy-mode-vi M-DoubleClick1Pane select-pane \; send -X select-word \; send -X copy-selection-and-cancel
bind -T copy-mode-vi M-TripleClick1Pane select-pane \; send -X select-line \; send -X copy-selection-and-cancel

bind -n DoubleClick1Pane select-pane -t = \; if-shell -F '#{mouse_any_flag}' 'send-keys -M' 'select-pane -t ='
bind -n TripleClick1Pane select-pane -t = \; if-shell -F '#{mouse_any_flag}' 'send-keys -M' 'select-pane -t ='
bind -n M-MouseDown1Pane copy-mode -M
bind -n M-DoubleClick1Pane select-pane -t = \; copy-mode -H \; send -X select-word \; send -X copy-selection-and-cancel
bind -n M-TripleClick1Pane select-pane -t = \; copy-mode -H \; send -X select-line \; send -X copy-selection-and-cancel

bind p paste-buffer -p
bind e run-shell '"#{E:DOTFILES_DIR}/bin/tmux-copy" --buffer --notify'
unbind ']'
unbind P

# Compact keyboard context menus. All destructive actions confirm.
bind < display-menu -T "#[align=centre]Window #I:#W" -x W -y W \
    "New After" n { new-window -a -c "#{pane_current_path}" } \
    "Rename" r { command-prompt -p "rename window (blank = automatic):" { if-shell -F "#{==:%%,}" { setw automatic-rename on } { rename-window "%%" } } } \
    '' \
    "Swap Left" h { swap-window -t :-1 } \
    "Swap Right" l { swap-window -t :+1 } \
    "Toggle Sync" s { setw synchronize-panes ; display-message "synchronize-panes #{?synchronize-panes,on,off}" } \
    '' \
    "Kill Window" x { confirm-before -p "kill-window #I:#W and all panes? (y/n)" kill-window }

bind > display-menu -T "#[align=centre]Pane #P" -x P -y P \
    "Split Right" r { split-window -h -c "#{pane_current_path}" } \
    "Split Below" b { split-window -v -c "#{pane_current_path}" } \
    '' \
    "Join Left" j { if-shell -F "#{>:#{window_index},1}" { join-pane -h -s "#{pane_id}" -t :-1 } { display-message "Cannot join: no window to the left" } } \
    "Leave Right" l { if-shell -F "#{>:#{window_panes},1}" { break-pane -a } { display-message "Cannot leave: this is the only pane" } } \
    "Join Marked" J { if-shell -F "#{pane_marked_set}" { join-pane -h -t "#{pane_id}" } { display-message "No marked pane" } } \
    '' \
    "#{?pane_marked,Unmark,Mark}" m { select-pane -m } \
    "Swap Up" u { swap-pane -U } \
    "Swap Down" d { swap-pane -D } \
    "#{?window_zoomed_flag,Unzoom,Zoom}" z { resize-pane -Z } \
    '' \
    "Kill Pane" x { confirm-before -p "kill-pane #P? (y/n)" kill-pane }

# Utility
bind r source-file ~/.tmux.conf \; display-message "Tmux config reloaded!"
bind R resize-window -A \; setw window-size latest \; refresh-client
bind C-l if-shell -F '#{alternate_on}' \
    'send-keys C-l' \
    'send-keys -R C-l ; clear-history'
bind M-c run-shell \
    'for p in $(tmux list-panes -s -F "#{pane_id}"); do \
       tmux clear-history -t "$p"; done' \; \
    display "All pane histories cleared"

# Prune inherited defaults outside this configuration's workflow. Keep the
# keyboard context menus (< for windows, > for panes).
unbind 0                                     # Windows start at 1; Alt+0 targets 10
unbind '*'
unbind f
unbind "'"
unbind M-1
unbind M-2
unbind M-3
unbind M-4
unbind M-5
unbind M-6
unbind M-7
unbind DC
unbind M-n
unbind M-p
unbind o
unbind ';'
unbind ','
unbind '.'
unbind '['
unbind '{'
unbind '}'
unbind M-Up
unbind M-Down
unbind M-Left
unbind M-Right
unbind C-o
unbind M-o
unbind '#'
unbind PPage

# ==============================================================================
# Mouse Support
# ==============================================================================

set -g mouse on

# Status-bar reordering is handled by prefix+i; remove the experimental drag
# bindings explicitly so a config reload clears them from a live server.
unbind -n M-MouseDown1Status
unbind -n M-MouseDrag1Status
unbind -n M-MouseDragEnd1Status

# Ordinary drag focuses the pane (or is forwarded to a mouse-aware app) without
# entering copy mode. Alt+drag explicitly starts a tmux selection; Shift+drag
# remains Windows Terminal's native selection gesture.
bind -n MouseDrag1Pane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "select-pane -t ="
bind -n M-MouseDrag1Pane copy-mode -M

# Wheel-up enters copy mode for scrollback when the application does not own it.
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"

# ==============================================================================
# Visual Styling - Dynamic Theme Loading
# ==============================================================================

# Fallback status content, set BEFORE the theme is sourced. Every theme defines
# status-left/right, so this only shows when no theme is installed. Ordering is
# the whole mechanism: last write wins, so the theme overrides these.
# (Previously these sat after the theme behind an `if-shell [ -z "$status_left" ]`
# test. $status_left is a shell variable that is never set, so the test always
# passed and the defaults silently clobbered every theme's status bar.)
set -g status-left '#[bold]  #S │ '
set -g status-right '#{user}@#h │ %a %b %d %H:%M '

# Theme wiring is owned by the optional feature. The command installs hooks
# when enabled and actively removes stale hooks/styles when disabled.
if-shell -b 'test -x "#{E:DOTFILES_DIR}/bin/theme-switcher"' \
    'run-shell "#{E:DOTFILES_DIR}/bin/theme-switcher tmux-configure >/dev/null 2>&1"'

# ==============================================================================
# Status Bar Configuration
# ==============================================================================

set -g status-position bottom
set -g status-justify left

# The current window supplies these values, so clients viewing different
# windows render matching status chrome. Session-scoped messages retain the
# session theme because tmux does not expose them per client.
set -g status-style default
set -g status-left '#{?@dotfiles_status_left,#{E:@dotfiles_status_left},#[bold]  #S │ }'
set -g status-right '#{?@dotfiles_status_right,#{E:@dotfiles_status_right},#{user}@#h │ %a %b %d %H:%M }'

# Status bar length
set -g status-left-length 40
set -g status-right-length 80

# Status content comes from the theme file (see "Fallback status content" above,
# which runs before the theme is sourced so the theme can override it).

# Window status format
#
# The agent badge (#{E:@cc_win_badge}) is NOT written here. The agent-badge
# plugin injects it into both formats below when it wires itself up -- see the
# run-shell further down. Keeping it out of this file is what lets the plugin be
# installed on a machine that has no dotfiles: it is distributed through Claude
# Code's and Codex's own plugin marketplaces, from plugins/agent-badge in this
# repo. See that directory's README for the glyph legend and the state machine.
#
# synchronize-panes is a per-window option, so put its warning on each affected
# window rather than only in status-right for the currently selected window.
# Reverse video inherits every theme's palette while remaining hard to miss.
set -g window-status-format ' #I:#W#F#{?synchronize-panes, #[reverse]SYNC#[noreverse],} '
set -g window-status-current-format ' #I:#W#F#{?synchronize-panes, #[reverse]SYNC#[noreverse],} '
set -g window-status-separator ''

# Agent badges are independently owned by the Claude/Codex marketplace plugins.
# The base tmux configuration intentionally contains no plugin wiring.

# ==============================================================================
# Activity and Monitoring
# ==============================================================================

# Disable activity monitoring (less noise)
setw -g monitor-activity off
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-bell off

# Swallow bells instead of forwarding them to the terminal. Default is
# `bell-action any`, which passes a real BEL through; Windows Terminal responds
# by raising/focusing the window, so every Claude turn completion yanked focus
# to whichever window finished. The window badge is the completion signal now.
set -g bell-action none
