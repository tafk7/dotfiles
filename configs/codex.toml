# BEGIN DOTFILES-MANAGED CODEX CONFIG
# Codex portable base configuration. installers/install-codex.sh installs this
# block into ~/.codex/config.toml and refreshes it on later runs while preserving
# Codex-owned project trust, hook trust, plugin state, and machine-local overlays.

model = "gpt-6-astra"
model_context_window = 872000
model_reasoning_effort = "xhigh"
plan_mode_reasoning_effort = "high"
approvals_reviewer = "user"

approval_policy = "on-request"
sandbox_mode = "workspace-write"

[history]
persistence = "save-all"

# Disable Codex's default-on metrics export. In release builds, stock Codex sends
# OpenTelemetry METRICS to OpenAI's Statsig endpoint (https://ab.chatgpt.com/
# otlp/v1/metrics) by default — metrics only, no prompt/code content, but still a
# third-party call. "none" turns it off. Traces and logs are already off by
# default; log_user_prompt = false keeps prompt text out of any traces you enable.
[otel]
metrics_exporter = "none"
log_user_prompt = false

# TAFK line-editing semantics for the Codex composer. Windows Terminal often
# encodes Ctrl+Backspace as Ctrl+H, so accept both names for word deletion.
[tui]
status_line = ["context-used", "total-output-tokens", "model"]

[tui.keymap.editor]
move_line_end = "end"
delete_backward = "backspace"
delete_backward_word = ["ctrl-backspace", "ctrl-h"]
delete_forward_word = "ctrl-delete"
kill_line_start = "alt-backspace"
kill_line_end = "alt-delete"

# END DOTFILES-MANAGED CODEX CONFIG

# Ctrl stays application-local; Alt remains available for tmux navigation.
[tui.keymap.global]
open_external_editor = "ctrl-e"

[tui.keymap.chat]
next_permission_mode = "ctrl-g"
previous_permission_mode = "ctrl-shift-g"
