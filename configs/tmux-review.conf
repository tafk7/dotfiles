# Review's keys, OFF since 2026-11-20: configs/tmux.conf does not source this
# file, and ScrollLock there only says review is off. It was laggy and did not
# work well enough; issues/review-mode.md records what to re-evaluate.
#
# To turn review back on, source this after configs/tmux.conf, e.g. at the end
# of ~/.tmux.local.conf or by hand for one server:
#     tmux source-file "$DOTFILES_DIR/configs/tmux-review.conf"
# tests/tmux-review.sh does the same, so bin/tmux-review stays tested.
#
# Review: ScrollLock (WezTerm sends Shift+F5) or prefix+f. A frozen view of the
# pane in copy-mode, with the copy-mode keys in configs/tmux.conf in every pane:
# a shell's history in place; an agent's conversation, as the agent exports it,
# in a review pane zoomed over the agent, which keeps running (bin/tmux-review).
# Shift+ScrollLock (Shift+F7) or prefix+/ reviews and searches upward at once;
# prefix+o, or o in review, opens the conversation or history read-only in nvim
# (configs/nvim/lua/dotfiles/review.lua gives it the same keys). Leaving
# copy-mode removes a review pane; the hook runs in the pane that changed mode.
bind f run-shell -b '"$DOTFILES_DIR/bin/tmux-review" toggle "#{pane_id}" "#{client_name}"'
bind -n S-F5 run-shell -b '"$DOTFILES_DIR/bin/tmux-review" toggle "#{pane_id}" "#{client_name}"'
bind -n S-F7 run-shell -b '"$DOTFILES_DIR/bin/tmux-review" search "#{pane_id}" "#{client_name}"'
bind / run-shell -b '"$DOTFILES_DIR/bin/tmux-review" search "#{pane_id}" "#{client_name}"'
bind o run-shell -b '"$DOTFILES_DIR/bin/tmux-review" edit "#{pane_id}" "#{client_name}"'
bind -T copy-mode-vi S-F5 send -X cancel
bind -T copy-mode-vi o run-shell -b '"$DOTFILES_DIR/bin/tmux-review" open "#{pane_id}" "#{client_name}"'
set-hook -g pane-mode-changed {
    if-shell -F '#{&&:#{@review-pane},#{==:#{pane_in_mode},0}}' {
        run-shell -b '"$DOTFILES_DIR/bin/tmux-review" close "#{pane_id}"'
    }
}
