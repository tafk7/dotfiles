# Codex TUI keybinding fragment for the TAFK workflow.
#
# Reference-only fragment. The same bindings are deployed as defaults from
# configs/codex.defaults.toml; keep this smaller file for copying into other setups.
#
# `/keymap` can inspect and persist bindings from inside Codex. When changing
# bindings there, mirror the resulting tui.keymap entries back into this file.

# TAFK line-editing semantics for the Codex composer. Windows Terminal often
# encodes Ctrl+Backspace as Ctrl+H, so accept both names for word deletion.
[tui.keymap.editor]
delete_backward = "backspace"
delete_backward_word = ["ctrl-backspace", "ctrl-h"]
delete_forward_word = "ctrl-delete"
kill_line_start = "alt-backspace"
kill_line_end = "alt-delete"

# F7 steps the permission mode (Read Only, Ask for approval, Approve for me);
# tmux's Alt+Shift+K and L press it to reach a mode while the prompt holds a
# draft (bin/tmux-agent-mode). Shift+Tab stays Codex's own. Effort
# is on Ctrl+PgUp/PgDn, as in the other agents, leaving Shift+Up/Down free.
# Ctrl+G (the editor) and Ctrl+E (end of line) keep Codex's defaults.
[tui.keymap.chat]
next_permission_mode = "f7"
increase_reasoning_effort = "ctrl-page-up"
decrease_reasoning_effort = "ctrl-page-down"
