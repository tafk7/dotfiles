# --- Tips: what no config binds ------------------------------------------------------------------
[tip.compose-editor-key]
label = "Ctrl+G / Ctrl+X E"
layer = "tmux"
apps = ["claude", "codex", "opencode"]
summary = "In Claude and Codex Ctrl+G, in OpenCode Ctrl+X E: move the prompt box into the compose pane, opening it if needed"
expands = "$VISUAL is bin/compose-editor, which runs tmux-compose editor"
anchor = ["bin/compose-editor", "tmux-compose"]

[tip.compose-return]
label = ":q / :wq / :cq"
layer = "nvim"
apps = ["nvim", "claude", "codex", "opencode"]
summary = "In compose on an agent: put the draft back in the agent's prompt box / keep it in the draft"
expands = "tmux-compose return, through the agent's editor key"
anchor = ["bin/tmux-compose", "tmux-compose return"]

[tip.compose-send]
label = "Ctrl+S"
layer = "nvim"
summary = "In compose: paste the draft into the agent and submit it without interrupting (shells: paste only)"
expands = "Claude, OpenCode Ctrl+X Enter; Codex Tab"
anchor = ["configs/nvim/lua/dotfiles/prose.lua", "deliver('send')"]

[tip.compose-stage]
label = "Ctrl+Shift+S / ,s"
layer = "nvim"
summary = "In compose: paste the draft into the agent without submitting"
expands = "bin/tmux-compose stage"
anchor = ["configs/nvim/lua/dotfiles/prose.lua", "deliver('stage')"]

[tip.compose-scroll]
label = "PgUp / PgDn / Ctrl+Home / Ctrl+End"
layer = "nvim"
summary = "In compose: scroll the agent's conversation from the compose pane"
expands = "bin/tmux-compose forward"
anchor = ["configs/nvim/lua/dotfiles/prose.lua", "forward('PPage')"]

[tip.compose-fix-spelling]
label = "Ctrl+L"
layer = "nvim"
summary = "In compose, insert mode: fix the last spelling or grammar mark before the cursor"
expands = "Harper's suggestion, else Vim's first spelling suggestion"
anchor = ["configs/nvim/lua/dotfiles/prose.lua", "fix_last()"]

[tip.vim-comment-motion]
label = "gc"
layer = "nvim"
summary = "Comment out a motion: gcap a paragraph, gcc a line (vim-commentary)"
anchor = ["configs/init.vim", "vim-commentary"]

[tip.vim-theme]
label = ":Theme"
layer = "nvim"
summary = "Pin this editor to a theme (follow = the window's theme)"
expands = ":Theme <name|follow>"
anchor = ["configs/init.vim", "Theme call dotfiles#theme#set"]

[tip.wezterm-select]
label = "Shift+drag"
layer = "wezterm"
summary = "Select natively in WezTerm, past tmux"
anchor = ["configs/tmux.conf", "Shift+drag"]

[tip.opencode-ctrl-r]
label = "Ctrl+R"
layer = "opencode"
summary = "Unbound, where the other agents search history (rename is in Ctrl+P)"
expands = "cli.json keybinds session.rename none"
anchor = ["configs/opencode-cli.defaults.json", "\"session.rename\": \"none\""]

[tip.theme-window]
label = "theme -w"
kind = "command"
summary = "Theme only this tmux window, or pick one"
expands = "theme -w [name]"
anchor = ["bin/theme-switcher", "-w|--window"]

[tip.theme-window-clear]
label = "theme -w clear"
kind = "command"
summary = "Make this window follow the global theme again"
expands = "theme -w clear"
anchor = ["bin/theme-switcher", "-w|--window"]

[tip.theme-current]
label = "theme --current"
kind = "command"
summary = "Show the global, window, and Neovim themes"
anchor = ["bin/theme-switcher", "--current|-c"]

[tip.theme-nvim]
label = "theme --nvim"
kind = "command"
summary = "Pin new Neovim instances to a theme (follow = the window's theme)"
expands = "theme --nvim [name|follow]"
anchor = ["bin/theme-switcher", "--nvim)"]

[tip.dotfiles-update]
label = "dotfiles update"
kind = "command"
summary = "Pull upstream, apply the machine profile, refresh, then verify"
expands = "dotfiles update [--dry-run] [--upgrade]"
anchor = ["bin/dotfiles", "  update  "]

[tip.dotfiles-apply]
label = "dotfiles apply"
kind = "command"
summary = "Bring this machine to the checkout and its profile, no pull"
expands = "dotfiles apply [--dry-run] [--only X,Y] [--upgrade]"
anchor = ["bin/dotfiles", "  apply  "]

[tip.dotfiles-upgrade]
label = "dotfiles upgrade"
kind = "command"
summary = "Update installed AI CLIs now, leaving the profile as it is (then keys defaults)"
expands = "dotfiles upgrade claude|codex|opencode|pi [--dry-run]"
anchor = ["bin/dotfiles", "  upgrade CLI"]

[tip.dotfiles-refresh]
label = "dotfiles refresh"
kind = "command"
summary = "Bring tmux up to date with the disk; list what needs a restart"
expands = "dotfiles refresh [-v]"
anchor = ["bin/dotfiles", "  refresh  "]

[tip.dotfiles-bump]
label = "dotfiles bump"
kind = "command"
summary = "Move a pin in versions.lock to a checked release; never commits"
expands = "dotfiles bump TOOL [VERSION]"
anchor = ["bin/dotfiles", "  bump TOOL"]

[tip.dotfiles-profile]
label = "dotfiles profile"
kind = "command"
summary = "Show or change what dotfiles manages here"
expands = "dotfiles profile [--add X|--remove X|--tier T|--propose]"
anchor = ["bin/dotfiles", "  profile  "]

[tip.dotfiles-verify]
label = "dotfiles verify"
kind = "command"
summary = "Check this machine against the checkout and profile; changes nothing"
expands = "dotfiles verify [-v] [--latest] [--tier T] [--all]"
anchor = ["bin/dotfiles", "  verify  "]

[tip.pip-editable]
label = "pip install -e ."
summary = "Install the package in editable (development) mode"
tags = ["python"]

[tip.uv-python-list]
label = "uv python list"
kind = "command"
summary = "List installed and available Python versions"
tags = ["python"]
anchor = ["shell/tools/python.sh", "uv python list/install/pin"]

[tip.uv-python-install]
label = "uv python install"
kind = "command"
summary = "Install a Python version"
expands = "uv python install <version>"
tags = ["python"]
anchor = ["shell/tools/python.sh", "uv python list/install/pin"]

[tip.uv-python-pin]
label = "uv python pin"
kind = "command"
summary = "Pin the Python version for the current project"
expands = "uv python pin <version>"
tags = ["python"]
anchor = ["shell/tools/python.sh", "uv python list/install/pin"]

[tip.uv-venv]
label = "uv venv --python"
kind = "command"
summary = "Create a venv with a specific Python"
expands = "uv venv --python <version>"
tags = ["python"]
anchor = ["shell/tools/python.sh", "`uv venv`"]

[tip.graphviz-dot]
label = "dot"
kind = "command"
summary = "Render a Graphviz DOT graph to an image"
expands = "dot -Tpng input.dot -o output.png"
tags = ["diagramming"]
