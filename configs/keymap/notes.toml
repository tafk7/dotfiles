# What keys shows that no config states (bin/keys, issues/keys-tool.md §2.3).
#
# Most descriptions live next to what they describe: a tmux binding's bind -N, a
# trailing comment on an alias or a WezTerm key, a Neovim map's desc, a script's
# header. This file holds the rest, keyed by entry id (keys ls --tsv lists them):
#
#   [note."ID"]     summary for an entry; also = [more ids with the same words]
#   [group.NAME]    match = an id glob; its entries show as one row, label and summary
#   [tip.NAME]      something no config binds: label, layer, summary, and an anchor,
#                   [file, literal], that keys check finds in the file (kind = command
#                   for a subcommand)
#   [hide]          ids = entries keys leaves out
#
# keys check fails when a note, group or hide matches no entry, or a tip's anchor is
# gone from its file: the drift a hand-written list could never catch.

# --- Groups --------------------------------------------------------------------------------------
[group.window-n]
match = "tmux:alt+[0-9]"
label = "Alt+1…0"
summary = "Jump to window 1-9; Alt+0 is window 10"

# --- Line editing in the shells (entry/bash.sh, entry/zsh.sh) --------------------------------------
[note."shell:ctrl+backspace"]
summary = "Delete from the cursor back through the previous word"
also = ["shell:ctrl+h"]

[note."shell:ctrl+delete"]
summary = "Delete from the cursor through the next word"

[note."shell:ctrl+z"]
summary = "Undo; never suspends (the terminal's suspend key is off; prefix Ctrl+Z suspends)"

[note."shell:alt+backspace"]
summary = "Delete from the cursor to the start of the line"
